# Postgres backend for Fountain. CNPG auto-generates Secret
# `fountain-pg-app` with `host`, `port`, `username`, `password`, `dbname`,
# `uri` keys — the Deployment consumes `uri` as DATABASE_URL.
#
# `standard` image variant pins postgres 18 with pgvector preinstalled.
# Fountain doesn't use embeddings today but the extension is cheap to
# carry and matches mem0 / guild — keep the lower-regret default.
# Pinned to 18.x to match Render's source DB during the home-cloud cutover.
#
# Single instance — Longhorn replicates the volume across nodes, which
# is enough durability for a personal cluster. Bump `instances` to 3
# only if Postgres-level HA matters more than the storage cost.
#
# Storage sized at 10Gi: Render's `basic-1gb` plan caps at 1GB so
# today's data is well under that. 20Gi was the original sizing but
# Longhorn's 3-replica default × 3 nodes (each 102 GB max, ~70 GB
# already scheduled) failed to schedule a 20Gi volume with
# `precheck new replica failed: insufficient storage`. 10Gi fits
# comfortably and Longhorn supports online expansion if/when the
# encrypted vault/environment rows + conversation turns outgrow it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: fountain-pg
  namespace: fountain
  labels:
    app: fountain
spec:
  instances: 1

  # Continuous WAL archiving via the barman-cloud CNPG-I plugin (#209) into
  # the ObjectStore defined in objectstore.yaml. Adding this injects the
  # plugin sidecar, which ROLLS THE POSTGRES POD — with instances: 1 that is
  # a brief database outage; the app's readiness probe drains and recovers
  # without restarts by design. Recovery objective once live: RPO <= ~5min
  # (WAL granularity), with the 03:17 pg_dump as the operator-independent
  # 24h fallback.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: fountain-backups

  # Exports the cnpg_* instance metrics (base-backup timestamps, WAL archive
  # status) to the cluster Prometheus — the fountain-pitr alert group in
  # prometheusrule.yaml is built on these series. Unlike the plugins block
  # above, this only creates a PodMonitor; it does not change the pod spec,
  # so enabling it does NOT roll the postgres pod.
  monitoring:
    enablePodMonitor: true

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie

  bootstrap:
    initdb:
      database: fountain
      owner: fountain
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  storage:
    storageClass: longhorn
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
