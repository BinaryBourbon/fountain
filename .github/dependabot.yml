# SHA-pinned actions never move on their own, and the two git-ref mix deps
# (dialyxir, if any others appear) sit outside `mix hex.audit` — dependabot is
# the only thing that will ever propose bumping any of these (#435).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # swift-actions/setup-swift v3 is a beta: the floating `v3` tag and
      # `v3.0.0-beta.1` are the same commit (364295d), while `v2` still points
      # at v2.4.0, which is what ci.yml and release.yml pin. The beta rewrote
      # toolchain setup on top of Swiftly, which GPG-verifies the download, and
      # the ubuntu-24.04 runner has no public key for it: `Swift SDK
      # (ubuntu-24.04)` dies on `gpg: Can't check signature: No public key` ->
      # `The process '/usr/bin/gpg' failed with exit code 2`. macos-15 passes,
      # so a bump looks half-green while taking the Swift SDK *release* job
      # down too, and a failed publish is invisible to every gate here (#1760).
      # Dependabot reads the floating `v3` tag as plain version 3, so it cannot
      # tell the beta from a future stable — this ignores the 3.x line whole.
      # Delete this entry when a stable v3.0.0 ships and re-test both jobs.
      - dependency-name: swift-actions/setup-swift
        versions: ["3.x"]

  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Security + patch/minor noise control: one PR per week at most per group.
    groups:
      hex-deps:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    groups:
      go-deps:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The two npm lockfiles. Added when `npm ci` in CI lost its implicit
  # `npm audit` call: that call printed advisories and could not fail a build,
  # while costing 88s to 302s per run waiting on an endpoint that stalls from a
  # runner. Removing it left these packages watched by nothing at all, so the
  # signal moves here, where it arrives as a PR someone can merge.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      sdk-typescript:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /scripts/destink
    schedule:
      interval: weekly
    groups:
      destink:
        update-types: [minor, patch]
