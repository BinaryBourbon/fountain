apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain
  namespace: fountain
  labels:
    app: fountain
  annotations:
    # When the Infisical operator rotates the `fountain-secrets` Secret
    # the operator restarts this Deployment so the new values take
    # effect. The Phoenix release reads env at boot, not per-request.
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  # Single replica: SECRET_KEY_BASE is one value across pods, so this is
  # safe to scale later — left at 1 for now to keep CNPG single-writer
  # behavior obvious and to match the current Render footprint.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fountain
  template:
    metadata:
      labels:
        app: fountain
    spec:
      containers:
        - name: fountain
          # Pinned to the sha tag produced by the build workflow for the
          # last commit that ran it. Update this alongside any deploy.
          image: ghcr.io/binarybourbon/fountain:sha-0e76cd7b287e6af13a1251cbff663985aafc87d3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            # CNPG-generated `fountain-pg-app` Secret. `uri` is the
            # postgres://user:pass@host:port/db URL Ecto consumes
            # directly via DATABASE_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fountain-pg-app
                  key: uri
            - name: PHX_SERVER
              value: "true"
            - name: PORT
              value: "4000"
            # Staging host during cutover. Flip to fountain.inevitable.fyi
            # in the same commit as the Cloudflare record swap. The
            # Certificate (certificate.yaml) and IngressRoute
            # (ingressroute.yaml) must move together.
            - name: FOUNTAIN_DOMAIN
              value: fountain.inevitable.fyi
            - name: EMAIL_FROM
              value: noreply@updates.inevitable.fyi
            # No OTLP collector in-cluster yet — without this,
            # opentelemetry_exporter retries localhost:4318 per span and
            # floods logs with :econnrefused. Swap to the real
            # OTEL_EXPORTER_OTLP_ENDPOINT once a collector is wired up.
            - name: OTEL_TRACES_EXPORTER
              value: "none"
          envFrom:
            # Materialized by the Infisical operator from the
            # InfisicalSecret CR (infisicalsecret.yaml). Provides:
            #   SECRET_KEY_BASE, MASTER_SECRETS_KEY, SPRITES_TOKEN,
            #   GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET,
            #   STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
            #   STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID,
            #   RESEND_API_KEY
            # MASTER_SECRETS_KEY MUST carry over verbatim from Render —
            # rotating it makes every envelope-encrypted vault and
            # environment value in the DB unreadable.
            - secretRef:
                name: fountain-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
