name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # --strict, matching `mix precommit`. CI used to run the default profile
      # while precommit ran --strict, so a strict violation passed CI and only
      # showed up for whoever ran precommit next.
      - name: Run Credo
        run: mix credo --strict

      - name: Audit dependencies
        # Deliberately non-blocking. A package can be retired upstream at any
        # moment by someone else, and that would break every build here for a
        # reason unrelated to the change under test. It stays visible in the
        # log. Currently flags earmark 1.4.48 (deprecated, unmaintained).
        continue-on-error: true
        run: mix hex.audit

      - name: Security scan (sobelow)
        run: mix sobelow --config

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The CLI had tests since launch that no workflow ever ran, so they gated
      # neither a merge nor a release.
      - name: CLI tests
        working-directory: cli
        run: go test ./...

      - name: CLI vet
        working-directory: cli
        run: go vet ./...

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Run tests with coverage
        run: mix coveralls

      - name: Validate OpenAPI spec
        run: mix openapi.spec.json --spec FountainWeb.ApiSpec --output /tmp/openapi.json && jq empty /tmp/openapi.json
