# What the manifest artifact deploys: the portable baseline plus the image
# built from this exact tree. Nothing else.
#
# publish-manifests.yml stages this directory and ../deploy into
# ghcr.io/binarybourbon/fountain-manifests, rewriting the two pins in pin.yaml
# (image tag, FOUNTAIN_BUILD_SHA) to the image that was actually built. That
# pairing — a tree and the image built from it, published as one artifact —
# is the invariant #231 established and #304 moved onto OCI; it holds here by
# construction because the base and the pin live in one tree.
#
# Everything personal to the maintainer's cluster — CNPG, Infisical, Traefik,
# hostnames, Erlang clustering, backups, alerts — used to live beside this
# file as a kustomize overlay. It moved to the (private) home-cloud repo, which
# applies it on top of this artifact with Flux's inline `patches` and a
# sibling Kustomization (decisions/0032). A self-hoster wants ../deploy/k8s,
# not this directory: docs/guides/operate/kubernetes.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../deploy/k8s

patches:
  - path: pin.yaml
