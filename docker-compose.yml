# Fountain, self-hosted.
#
#   cp .env.compose.example .env    # then fill in the generated keys
#   docker compose up -d
#   open http://localhost:4000
#
# For local development you only want the database, and `docker compose up -d
# postgres` still does exactly that — `mix setup` creates fountain_dev itself.
# See SETUP.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fountain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The app runs migrations at boot, so it must not start against a
      # database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U postgres -d fountain"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/binarybourbon/fountain:${FOUNTAIN_IMAGE_TAG:-latest}
    # To run your own build instead of the published image, comment the line
    # above and uncomment this:
    #   build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PHX_SERVER: "true"
      PORT: "4000"

      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fountain
      # A stock postgres image does not serve TLS, and this was hardcoded on —
      # which is why a compose setup could not have worked before.
      DATABASE_SSL: "false"
      # Only meaningful against an external Postgres that serves TLS (which
      # also means editing DATABASE_URL and DATABASE_SSL above): verify its
      # certificate instead of the default encrypted-but-unauthenticated mode.
      DATABASE_SSL_VERIFY: ${DATABASE_SSL_VERIFY:-}
      DATABASE_SSL_CA_FILE: ${DATABASE_SSL_CA_FILE:-}

      # Absolute and scheme-ful: it builds the links in verification emails and
      # is handed to every sprite as FOUNTAIN_BASE_URL. Change it if you reach
      # this instance by anything other than localhost.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}

      # Extra origins allowed to open a LiveView websocket, comma-separated.
      # The PUBLIC_URL host is always allowed.
      CHECK_ORIGIN_EXTRA: ${CHECK_ORIGIN_EXTRA:-}

      # Behind a reverse proxy, set this to the proxy's address range before
      # exposing the instance — otherwise per-IP rate limits collapse into a
      # single bucket keyed on the proxy's address.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      # Required, but enforced by the app at boot (config/runtime.exs raises
      # a descriptive error for either one missing or empty) rather than by a
      # compose `:?` marker: compose interpolates this whole file at load
      # time regardless of which service is targeted, so a hard requirement
      # here made even `docker compose up -d postgres` — the documented
      # database-only dev path — abort on a fresh clone (#392).
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      MASTER_SECRETS_KEY: ${MASTER_SECRETS_KEY:-}

      # Conversations need a Sprites token. The app boots without one; every
      # attempt to start a conversation then fails.
      SPRITES_TOKEN: ${SPRITES_TOKEN:-}
      # Point at a different Sprites endpoint (#189). The fallback mirrors the
      # app's own default — an unset ${VAR:-} interpolates to "", and a blank
      # base URL is not a usable endpoint.
      SPRITES_BASE_URL: ${SPRITES_BASE_URL:-https://api.sprites.dev}

      # Sandbox lifetime bounds; 0 disables one. The fallbacks mirror the
      # app's own defaults and are spelled out because the app refuses to
      # boot on a non-integer, and an unset ${VAR:-} interpolates to "".
      SANDBOX_IDLE_TIMEOUT_MINUTES: ${SANDBOX_IDLE_TIMEOUT_MINUTES:-60}
      SANDBOX_MAX_LIFETIME_HOURS: ${SANDBOX_MAX_LIFETIME_HOURS:-24}

      # Off by default (the app's own default since #336, pinned here too):
      # the subscription gate is meaningful for the hosted service and is a
      # lock with no key on a self-hosted instance.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}

      # No mail by default, so a first run needs nothing external. Verify your
      # account with:
      #   docker compose exec app bin/fountain_server eval \
      #     'Fountain.Release.verify_email("you@example.com")'
      # Set RESEND_API_KEY or SMTP_HOST to send real mail instead.
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}

      # Open by default so the first account can be created. Close it once
      # yours exists.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Comma-separated. Empty means any domain may register.
      REGISTRATION_ALLOWED_EMAIL_DOMAINS: ${REGISTRATION_ALLOWED_EMAIL_DOMAINS:-}

      # Error tracking. Off unless set — nothing leaves the instance.
      SENTRY_DSN: ${SENTRY_DSN:-}

      # There is no OTLP collector in a default compose setup, and without this
      # the exporter retries per span and floods the logs.
      OTEL_TRACES_EXPORTER: "none"
    healthcheck:
      # Probes the documented /health endpoint, so `docker compose ps` flags a
      # hung-but-running app instead of reporting it healthy forever. The
      # runtime image (debian slim) ships neither curl nor wget, so this does
      # the HTTP round-trip with bash's /dev/tcp — bash, printf and grep are
      # all in the base image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000 && printf 'GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Boot runs migrations before the endpoint listens; don't count failures
      # against the container while that is still happening.
      start_period: 40s
    restart: unless-stopped

  # Nightly pg_dump into the backup_data volume, pruned after
  # BACKUP_RETENTION_DAYS. Off unless you opt in:
  #
  #   docker compose --profile backup up -d
  #
  # The volume lives on the same host as the database, so this protects
  # against bad migrations and fat fingers, not a dead machine — copy dumps
  # off-host too, and back up MASTER_SECRETS_KEY separately: a database
  # backup alone cannot decrypt itself. Restore drill:
  # https://binarybourbon.github.io/fountain/operations/#backup-and-restore
  backup:
    image: postgres:16
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: fountain
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/bash", "-c"]
    command:
      # A failed dump logs, deletes its partial file, and leaves every old
      # backup alone — pruning happens only after a successful dump, so a
      # broken database can never age out the backups you would restore from.
      - |
        while true; do
          TS="$$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          OUT="/backups/fountain-$${TS}.dump"
          echo "Dumping to $${OUT}..."
          if pg_dump -Fc -Z6 --no-owner --no-privileges -f "$$OUT" \
             && [ "$$(stat -c %s "$$OUT")" -ge 10240 ]; then
            echo "Backup complete: $${OUT} ($$(stat -c %s "$$OUT") bytes)"
            find /backups -name 'fountain-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          else
            echo "FAIL: dump did not complete; keeping old backups"
            rm -f "$$OUT"
          fi
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    volumes:
      - backup_data:/backups
    restart: unless-stopped

volumes:
  postgres_data:
  backup_data:
