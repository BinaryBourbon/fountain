<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Keep this card in step with the paper skin in priv/static/assets/paper.css. -->
  <rect width="1200" height="630" fill="#f4f1f8" />
  <rect x="896" width="304" height="630" fill="#e9e0f8" />

  <image href="../apps/fountain/priv/static/images/mark-mono.png" x="78" y="54" width="64" height="64" />
  <text x="164" y="94" fill="#5b5266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" letter-spacing="2.2">OPEN SOURCE · SELF-HOSTABLE</text>

  <text x="78" y="240" fill="#1c1620" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="69" font-weight="600" letter-spacing="-1.5">Run coding agents</text>
  <text x="78" y="316" fill="#1c1620" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="69" font-weight="600" letter-spacing="-1.5">on ready machines.</text>
  <text x="78" y="397" fill="#553196" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="43" font-weight="600" letter-spacing="-0.6">Pay only while they work.</text>

  <text x="80" y="480" fill="#5b5266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Repositories, packages and credentials arrive with the machine.</text>
  <text x="80" y="518" fill="#5b5266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">It parks between prompts and wakes with its work intact.</text>

  <g transform="translate(952 107)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <line x1="18" y1="25" x2="18" y2="365" stroke="#bda9e4" stroke-width="3" />
    <circle cx="18" cy="25" r="9" fill="#553196" />
    <circle cx="18" cy="195" r="9" fill="#553196" />
    <circle cx="18" cy="365" r="9" fill="#f4f1f8" stroke="#553196" stroke-width="3" />

    <text x="48" y="20" fill="#412475" font-size="14" font-weight="700" letter-spacing="1.8">PROMPT</text>
    <text x="48" y="48" fill="#1c1620" font-size="22" font-weight="600">Wake</text>
    <text x="48" y="190" fill="#412475" font-size="14" font-weight="700" letter-spacing="1.8">AGENT</text>
    <text x="48" y="218" fill="#1c1620" font-size="22" font-weight="600">Work</text>
    <text x="48" y="360" fill="#412475" font-size="14" font-weight="700" letter-spacing="1.8">QUIET</text>
    <text x="48" y="388" fill="#1c1620" font-size="22" font-weight="600">Park</text>
  </g>

  <line x1="80" y1="581" x2="1120" y2="581" stroke="#bda9e4" stroke-width="2" />
