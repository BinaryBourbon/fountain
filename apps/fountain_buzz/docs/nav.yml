# The Buzz extension's slice of the manual (ADR 0043, #1510).
#
# `FountainBuzz.Docs` parses this at compile time exactly as `Fountain.Docs`
# parses the host's `docs/nav.yml`, and `Fountain.Manual` merges the result
# into the sidebar. The two line shapes and the one-level-deep rule are the
# same, and a line the parser cannot read raises here too.
#
# **The section titles must match the host's**, or these pages open a second
# section with the same name instead of joining the one a reader knows. That is
# `Catalog` and `Plug into Fountain` today; `Fountain.Manual.nav/0` merges by
# title, and `FountainBuzz.DocsTest` asserts the merge put them where they were
# before the move.
#
# Paths are relative to this directory.
nav:
  - Catalog:
      - fountain-buzz: catalog/mcp-servers/fountain-buzz.md
  - Plug into Fountain:
      - Buzz (Nostr): integrations/buzz.md
