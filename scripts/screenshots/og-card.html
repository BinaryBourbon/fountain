<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Fountain product card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f1f3fc; color: #171b31; font-family: Arial, sans-serif; }
  .brand { position: absolute; left: 42px; top: 42px; font-size: 26px; font-weight: 700; }
  h1 { position: absolute; left: 42px; top: 148px; margin: 0; width: 295px; font-size: 48px; line-height: 1.08; letter-spacing: -2px; }
  .apps { position: absolute; left: 42px; top: 413px; width: 280px; font-size: 19px; line-height: 1.65; color: #48516d; }
  .desktop { position: absolute; left: 361px; top: 48px; width: 681px; border: 1px solid #cbd0e7; border-radius: 14px; box-shadow: 0 18px 45px #273b8529; }
  .phone { position: absolute; right: 27px; top: 157px; width: 190px; padding: 7px; border-radius: 27px; background: #242735; box-shadow: 0 12px 32px #11182740; }
  .phone img { display: block; width: 100%; border-radius: 20px; }
  .caption { position: absolute; left: 42px; bottom: 28px; color: #68718c; font-size: 12px; }
</style>
<div class="brand">Fountain</div>
<h1>Give an agent a task.<br>Watch it work.</h1>
<div class="apps">Conversations<br>Team<br>Workbench</div>
<img class="desktop" src="conversations.jpg" alt="Conversations showing a code diff and running tests">
<div class="phone"><img src="workbench-mobile.jpg" alt="Workbench on a phone with Builder assigned to a work item"></div>
<div class="caption">Real app screens · seeded local example</div>
</html>
