# SHA-pinned actions never move on their own, and the two git-ref mix deps
# (dialyxir, if any others appear) sit outside `mix hex.audit` — dependabot is
# the only thing that will ever propose bumping any of these (#435).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # swift-actions/setup-swift v3 is a beta: the floating `v3` tag and
      # `v3.0.0-beta.1` are the same commit (364295d), while `v2` still points
      # at v2.4.0, which is what ci.yml and release.yml pin. The beta rewrote
      # toolchain setup on top of Swiftly, which GPG-verifies the download, and
      # the ubuntu-24.04 runner has no public key for it: `Swift SDK
      # (ubuntu-24.04)` dies on `gpg: Can't check signature: No public key` ->
      # `The process '/usr/bin/gpg' failed with exit code 2`. macos-15 passes,
      # so a bump looks half-green while taking the Swift SDK *release* job
      # down too, and a failed publish is invisible to every gate here (#1760).
      # Dependabot reads the floating `v3` tag as plain version 3, so it cannot
      # tell the beta from a future stable — this ignores the 3.x line whole.
      # `github-actions` parses `versions` as a Bundler requirement, so the
      # range is spelled `~> 3.0`; an npm-style `3.x` parses to `= 3.x`, which
      # matches no version at all and silently ignores nothing.
      # Delete this entry when a stable v3.0.0 ships and re-test both jobs.
      - dependency-name: swift-actions/setup-swift
        versions: ["~> 3.0"]

  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    # Security + patch/minor noise control: one PR per week at most per group.
    groups:
      hex-deps:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
    groups:
      go-deps:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The two npm lockfiles. Added when `npm ci` in CI lost its implicit
  # `npm audit` call: that call printed advisories and could not fail a build,
  # while costing 88s to 302s per run waiting on an endpoint that stalls from a
  # runner. Removing it left these packages watched by nothing at all, so the
  # signal moves here, where it arrives as a PR someone can merge.
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      sdk-typescript:
        update-types: [minor, patch]
    ignore:
      # The SDK generates `src/generated/openapi.ts` with openapi-typescript,
      # which builds its AST through the compiler API it imports directly
      # (`import ts from 'typescript'`, dist/lib/ts.mjs:2) and so declares
      # `peerDependencies: {"typescript": "^5.x"}`. Every published release
      # carries that peer, 7.7.3 through 7.13.0 (`latest`); the `next` tag is
      # the older 7.0.0-rc.1. A TypeScript major above 5 therefore makes the
      # tree unresolvable and `npm ci` exits 1 on ERESOLVE before typecheck,
      # tests, build, `verify-contract`, conformance or the generated-types
      # freshness diff get to say whether the compiler itself is fine
      # (ci.yml `SDK install`, and sdk-publish.yml runs the same install).
      # `--legacy-peer-deps` is not the way out: it would run a TS-5-targeting
      # generator against the newer compiler API, and the `SDK types match the
      # spec` step fails on any diff in the regenerated output.
      # Majors as a class, not 6.x alone: the peer pins the 5 line, so 6, 7 and
      # anything after it break identically. Minors and patches still arrive,
      # grouped above.
      # `ignore` withholds security updates too, not just version updates, so a
      # TypeScript advisory fixed only in 6.x or later would also be held back.
      # Accepted: it is a devDependency, never shipped to SDK consumers, and the
      # 5.x line still gets patches through the group.
      # Delete this entry when openapi-typescript declares support for a newer
      # TypeScript major, and bump both together (#1759). Deleting it does not
      # restore 7.x on its own: #1557 used `@dependabot ignore this major
      # version`, recording `typescript [>= 7.a, < 8]` in dependabot's central
      # state, which no file here shows. Run
      # `@dependabot show typescript ignore conditions` to see what is stored,
      # then `@dependabot unignore typescript [>= 7.a, < 8]` to clear it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /scripts/destink
    schedule:
      interval: weekly
    groups:
      destink:
        update-types: [minor, patch]
