name: Elixir SDK release gate

# A shipped Elixir SDK change needs a new version before it reaches main. Test
# changes and release notes alone do not. The first release has no base version
# and passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "sdk/elixir/**"
      - "scripts/elixir-sdk-release.exs"
      - ".github/workflows/elixir-sdk-release-gate.yml"

permissions:
  contents: read

jobs:
  minimum-version:
    name: Elixir 1.15 / OTP 26 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir 1.15 and OTP 26
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.15.8"
          otp-version: "26.2.5"

      - name: Install dependencies
        working-directory: sdk/elixir
        run: mix deps.get

      - name: Compile with warnings as errors
        working-directory: sdk/elixir
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: sdk/elixir
        run: mix test

  gate:
    name: A shipped change has a releasable version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'sdk-no-release') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Does this PR need a version bump?
        run: elixir scripts/elixir-sdk-release.exs guard "origin/${{ github.base_ref }}"

      - name: Install documentation dependencies
        working-directory: sdk/elixir
        env:
          MIX_ENV: dev
        run: mix deps.get

      - name: Build documentation
        working-directory: sdk/elixir
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors

      - name: Build the Hex package
        working-directory: sdk/elixir
        env:
          MIX_ENV: dev
        run: mix hex.build
