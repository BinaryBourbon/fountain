name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # PRs only (#414): cancelling superseded MAIN runs meant a rapid merge
  # sequence could strand a code commit un-built — commit A's CI cancelled
  # by docs-only commit B, whose own HEAD^..HEAD build filter then reported
  # "nothing image-affecting", so A never produced an image and every check
  # stayed green. Main runs queue instead of cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Two kinds of Elixir job, not one. The test suite used to be ~4m30s of the
# ~6m50s a PR took, and every other gate — format, credo, sobelow, dialyzer, the
# Go CLI checks, the release boot probe — was queued behind or ahead of it in
# the same job while sharing nothing with it but the checkout. #619 split them
# so the suite runs alone on the critical path with the rest beside it.
#
# #620 then split the suite itself across three machines. ExUnit reported why:
#
#   Finished in 252.3 seconds (140.7s async, 111.6s sync)
#
# The async phase scales with cores; the sync phase does not — ExUnit runs
# `async: false` modules one at a time on one core once the async phase drains,
# and 55 of 198 modules are `async: false` for real reasons (Application.put_env
# in the config tests, set_mimic_global in 13 files, the ETS rate-limit table).
# No runner size crosses that floor; only separate OS processes do, because
# separate partitions are separate BEAMs. Splitting N ways drops the serial
# tail to roughly 1/N of it, and each partition gets its own Postgres rather
# than the whole suite sharing one 20-connection pool.
#
# #894 took it from three to six, because this matrix is the critical path for
# every commit: the slowest partition plus the serial coverage gate IS the
# wall-clock of CI. At three, the slowest partition was ~5m of a ~5m54s run.
# The limit is that ~60s of each job is fixed cost that does not divide
# (Postgres container init dominates), so the marginal win shrinks: six roughly
# halves the test work for two more jobs' worth of that cost, and eight would
# buy only ~30s beyond six. Shrink the 60s before adding a seventh.
#
# The cost is that each partition instruments every module while exercising a
# fraction of the tests, so no partition's coverage means anything on its own.
# Hence the `coverage` job: partitions export, it merges, and the 85% threshold
# is enforced once against the union (see mix.exs / coverage.exs).
#
# On main, most of that is a re-run. PRs are squash-merged after a rebase, so
# the commit that lands on main usually has the *same tree* as the PR head —
# the exact tree the PR's CI run already passed (a rebased head contains
# main's tip, so the merge ref GitHub tested was the head itself). 10 of 12
# recent main commits were like that, and each spent ~10 minutes re-proving
# it before build.yml was allowed to start. The `already-tested` job checks
# for that case and, when it holds, lets every other job skip; the run still
# concludes `success`, which is all build.yml's workflow_run gate asks. Any
# doubt — no associated PR, a differing tree, no successful PR run, an API
# hiccup — falls through to the full run, never to a skip.
# The one place the Postgres pin lives. The jobs that need a database start it
# themselves (see "Start Postgres in the background"), so it is no longer
# expressible as a `services:` image.
env:
  PG_IMAGE: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb

jobs:
  already-tested:
    name: Skip the re-run when a PR already tested this exact tree
    # Push-to-main only. On pull_request this job is skipped, its outputs are
    # empty, and the `!= 'true'` tests below let everything run as before.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read
      actions: read

    outputs:
      skip: ${{ steps.probe.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Compare this tree with the tested PR head
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        # Never fails: every branch of this script ends in a decision, and the
        # decision on any error is "run the full CI".
        run: |
          set -u
          skip=false
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "main tree: ${tree}"

          heads="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                     --jq '.[] | select(.merged_at != null) | .head.sha' 2>/dev/null || true)"
          if [ -z "${heads}" ]; then
            echo "no merged PR is associated with ${GITHUB_SHA:0:7} — running the full CI"
          fi

          for head in ${heads}; do
            if ! git fetch --quiet --depth=1 origin "${head}" 2>/dev/null; then
              echo "PR head ${head:0:7} could not be fetched"
              continue
            fi
            head_tree="$(git rev-parse "${head}^{tree}")"
            if [ "${head_tree}" != "${tree}" ]; then
              echo "PR head ${head:0:7} has tree ${head_tree:0:7} — differs; the merge produced a tree no PR run tested"
              continue
            fi
            # A completed, successful CI run on that head, triggered by the PR.
            # `status=success` excludes the cancelled runs that PR
            # cancel-in-progress leaves behind.
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&event=pull_request&status=success&per_page=50" \
                        --jq '[.workflow_runs[] | select(.name == "CI")] | first | .id // empty' 2>/dev/null || true)"
            if [ -z "${run_id}" ]; then
              echo "PR head ${head:0:7} has the same tree but no successful pull_request CI run"
              continue
            fi
            echo "PR head ${head:0:7} has the same tree and CI run ${run_id} passed on it — skipping the re-run"
            echo "tested by https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
            skip=true
            break
          done

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  changes:
    name: Decide whether this is a docs-only change
    # pull_request only, and deliberately so. On push, `already-tested` above
    # already collapses a rebased squash-merge to a few seconds, and a main
    # push that is NOT already-tested is precisely the case that must run
    # everything. Skipped here means empty outputs, and the `!= 'true'` tests
    # below let every job run exactly as before — the same shape the
    # already-tested gate uses.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      docs_touched: ${{ steps.filter.outputs.docs_touched }}
      cli_docs: ${{ steps.filter.outputs.cli_docs }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        # An ALLOWLIST, not an ignore list, and that direction is the whole
        # safety argument: a path is docs-only if it is under docs/, and
        # anything else — including this workflow — falls through to the
        # full suite. A new top-level directory nobody
        # thought about is therefore tested, not skipped. The failure mode is
        # "ran too much", never "ran too little".
        #
        # Never fails: like the already-tested probe, every branch ends in a
        # decision and the decision on any error is "run the full CI".
        #
        # CHANGELOG.md is NOT on the allowlist even though docs/changelog.md
        # snippet-includes it — it is touched by the release-bump flow, where
        # skipping the suite is not wanted.
        run: |
          set -u
          decide() {
            echo "docs_only=$1" >> "$GITHUB_OUTPUT"
            echo "cli_docs=$2" >> "$GITHUB_OUTPUT"
            echo "docs_touched=$3" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! git fetch --no-tags --quiet origin \
               "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" 2>/dev/null; then
            echo "could not fetch base ${GITHUB_BASE_REF} — running the full CI"
            decide false false true
          fi

          base="$(git merge-base "refs/remotes/origin/${GITHUB_BASE_REF}" HEAD 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            echo "no merge base with ${GITHUB_BASE_REF} — running the full CI"
            decide false false true
          fi

          changed="$(git diff --name-only "${base}" HEAD 2>/dev/null || true)"
          if [ -z "${changed}" ]; then
            echo "empty diff against ${base:0:7} — running the full CI"
            decide false false true
          fi

          echo "changed against ${base:0:7}:"
          printf '%s\n' "${changed}" | sed 's/^/  /'

          # Both halves of the CLI reference: the hand-written index and the
          # generated docs/cli/commands.md. The generated one matters here
          # because a docs-only PR that hand-edits it would otherwise skip the
          # Go tests entirely, and the staleness check lives in them.
          cli_docs=false
          if printf '%s\n' "${changed}" | grep -qE '^docs/cli\.md$|^docs/cli/'; then
            cli_docs=true
          fi

          # Whether ANY docs path moved, independent of whether the diff is
          # docs-ONLY. A mixed PR takes the `checks` path, which carried no
          # docs gate at all before, so prose errors surfaced on main after
          # the merge.
          #
          # docs/nav.yml is under docs/ and so is covered by both greps here
          # without a special case — it used to be mkdocs.yml at the repo root,
          # which needed naming twice (#1008).
          docs_touched=false
          if printf '%s\n' "${changed}" | grep -qE '^docs/'; then
            docs_touched=true
          fi

          # grep -qv succeeds when ANY line falls outside the allowlist, so
          # the negation is "every changed path is a docs path".
          if printf '%s\n' "${changed}" | grep -qvE '^docs/'; then
            echo "non-docs paths changed — running the full CI"
            decide false "${cli_docs}" "${docs_touched}"
          fi

          echo "docs-only — running the docs job instead of the Elixir suite"
          decide true "${cli_docs}" false

  test:
    name: Build and Test (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [already-tested, changes]
    # `!cancelled()` rather than the implicit success(): on pull_request the
    # gate job is skipped, and a skipped `needs` would skip this job too.
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    strategy:
      # Each partition is an independent verdict and all six are wanted: a
      # cancelled sibling would leave the coverage merge without its export and
      # turn one test failure into two unrelated-looking ones.
      fail-fast: false
      matrix:
        # The single source of truth for how many partitions there are — the
        # `--partitions` argument below is `strategy.job-total`, so adding an
        # entry here is the whole change.
        #
        # Six, not three, because this matrix is the critical path for every
        # commit: the slowest partition plus the serial coverage gate IS the
        # wall-clock of CI, and at three the slowest was ~5m. Each job carries
        # ~60s of fixed cost (Postgres container init dominates) that does not
        # divide, so the win shrinks as the count grows — six roughly halves
        # the test work while paying that cost twice more, and eight would buy
        # only ~30s beyond it. Attack the 60s before adding a seventh.
        partition: [1, 2, 3, 4, 5, 6]

    outputs:
      # Same value from every partition, so which one wins the race to set it
      # does not matter. The coverage job uses it to check that it merged an
      # export from every partition rather than from whichever ones uploaded.
      partitions: ${{ steps.total.outputs.count }}

    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Cache keys carry the job name. `test` and `checks` build different
      # trees — this one only ever compiles :test, while `checks` additionally
      # builds :dev for dialyzer and :prod for the release — and a shared key
      # would have them racing to save mutually incomplete archives under it,
      # winner decided by whichever finished first. Same reasoning as the
      # deliberately-narrow restore-keys below: a cache whose contents depend
      # on who got there first is the failure mode being avoided.
      #
      # The partitions DO share a key, and that is not the same race:
      # they compile one identical :test tree and differ only in which test
      # files they load, so whichever wins the save has saved the same archive
      # the others would have. Giving each partition its own key would multiply
      # the storage for identical content and stop them warming each other.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback: BEAM bytecode compiled by a different
          # OTP/Elixir is rebuilt from scratch anyway, and a cross-version
          # restore has produced subtle staleness — the same hazard the PLT
          # cache in `checks` avoids by omitting restore-keys entirely.
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Coverage instrumentation is free here — measured at 128.8s with cover
      # against 128.6s without, on the same machine. Running the suite bare on
      # PRs and gating coverage elsewhere would buy nothing and cost the gate.
      #
      # The script exists for the assertion, not for the mix invocation: with
      # partitioning, "ran zero tests" and "passed" are both exit 0, so it
      # parses ExUnit's summary line and refuses to succeed without one. See
      # the header of scripts/test-partition.sh.
      - name: Run tests with coverage
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: scripts/test-partition.sh ${{ strategy.job-total }}

      # The umbrella library apps (apps/managoat_*, decisions/0037) are not in
      # the partition manifest: their tests belong to the library and run from
      # its own directory, instrumenting its own modules. One partition runs
      # them all and copies the exports into the merge directory as lib-*, so
      # the coverage gate below stands on the union. Partition 1 rather than a
      # job of its own because a job carries ~60s of fixed cost and the
      # libraries' suites are seconds; give a library its own matrix entry
      # when that stops being true.
      - name: Run the library apps' tests with coverage
        if: ${{ matrix.partition == 1 }}
        run: scripts/test-libraries.sh

      - name: Publish the partition count
        id: total
        run: echo "count=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverdata-${{ matrix.partition }}
          # The lib-* globs match only on the partition that ran the library
          # apps; if-no-files-found looks at the set as a whole, so the other
          # partitions still upload their own pair without complaint.
          path: |
            apps/fountain/cover/${{ matrix.partition }}.coverdata
            apps/fountain/cover/${{ matrix.partition }}.tests
            apps/fountain/cover/lib-*.coverdata
            apps/fountain/cover/lib-*.tests
          # An export that silently fails to upload would leave the merge job
          # gating on a fraction of the suite while still printing a number.
          if-no-files-found: error
          retention-days: 1

  # The 85% gate, enforced once against every partition's data. It is a
  # separate job because there is nowhere else it can live: no partition can
  # see the others' coverage, and ExCoveralls — which this replaced in #620 —
  # had no way to merge across machines at all. Elixir's built-in cover does,
  # via the exports `mix test --partitions` writes.
  #
  # Deliberately light. `mix test.coverage` runs no tests and needs no
  # database — it imports .coverdata and reports — so this job is a checkout,
  # two cache restores and a few seconds of merging.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    # Still "after a green suite" — but spelled out, because test is skipped
    # (not failed) on the already-tested path and must not drag this along.
    if: ${{ !cancelled() && needs.test.result == 'success' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Both caches share the `test` job's keys: same tree, and by now the
      # partitions have already saved them, so this restores rather than
      # competes. The build cache is load-bearing, not a nicety — the task
      # itself compiles nothing, but Mix runs loadpaths underneath it and will
      # build the whole dependency tree into an empty _build first. Measured on
      # a 10-core machine: 3.7s warm, 38.5s cold.
      - name: Download coverage exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: apps/fountain/cover

      # `mix test.coverage` reports on whatever exports it finds and says
      # nothing about the ones it did not. Two partitions' data would produce a
      # real-looking table with a number nobody could interpret, so the count
      # is checked before the threshold is trusted. Summing the per-partition
      # test counts is the same check from the other side, and puts the size of
      # the suite the gate stood on into the log.
      - name: Check every partition reported
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=${{ needs.test.outputs.partitions }}
          exports=(apps/fountain/cover/[0-9]*.coverdata)
          if [ "${#exports[@]}" -ne "$expected" ]; then
            echo "merged ${#exports[@]} coverage exports, expected $expected" >&2
            exit 1
          fi
          # The library apps' exports (scripts/test-libraries.sh): one per
          # apps/managoat_* directory, or the gate would stand on the
          # partitions alone and the libraries' coverage would go unmeasured.
          libs=(apps/managoat_*/)
          lib_exports=(apps/fountain/cover/lib-*.coverdata)
          if [ "${#lib_exports[@]}" -ne "${#libs[@]}" ]; then
            echo "merged ${#lib_exports[@]} library exports, expected ${#libs[@]} (one per apps/managoat_*)" >&2
            exit 1
          fi
          total=$(cat apps/fountain/cover/*.tests | awk '{s += $1} END {print s + 0}')
          echo "merging ${#exports[@]} partitions and ${#lib_exports[@]} library apps covering $total tests"

      # Not `mix test.coverage`: ~90% of that task's time is rendering an
      # HTML report — 530 files, 129MB — that this job never opens, since all
      # it does is assert a threshold and exit. The script computes the same
      # number from the same coverage.exs (verified identical, 85.46% both, on
      # the same six exports), and prints the least-covered modules so a
      # failure still says where to look.
      #
      # `elixir`, not `mix run`: the script reads .coverdata and coverage.exs
      # and touches nothing else, so it needs no deps, no _build and no
      # compile. Through `mix run` this step spent most of its time
      # recompiling the app for a script that never calls it ("Compiling 10
      # files" for a 12s step). That is also why this job no longer restores
      # the deps/build caches or runs deps.get.
      #
      # Run `mix test.coverage` locally for the full table and the HTML.
      - name: Enforce the coverage threshold
        run: elixir scripts/coverage-gate.exs

  checks:
    name: Static analysis and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    # Postgres is here for the release boot check alone: /health/ready calls
    # Fountain.Health.database/0, and the release task that runs after it
    # queries users. Both need a migrated fountain_test to answer honestly.
    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-checks-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-checks-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-checks-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-checks-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # --strict, matching `mix precommit`. CI used to run the default profile
      # while precommit ran --strict, so a strict violation passed CI and only
      # showed up for whoever ran precommit next.
      - name: Run Credo
        run: mix credo --strict

      - name: Audit dependencies
        # Deliberately non-blocking. A package can be retired upstream at any
        # moment by someone else, and that would break every build here for a
        # reason unrelated to the change under test. It stays visible in the
        # log. Currently flags earmark 1.4.48 (deprecated, unmaintained).
        continue-on-error: true
        run: mix hex.audit

      # Not plain `mix sobelow`: at the umbrella root sobelow detects no
      # Phoenix app, scans nothing, and exits 0 — indistinguishable from a
      # pass (#194, #311). The script scans a merged tree so ee/lib web
      # modules are covered too (decisions/0010).
      - name: Security scan (sobelow)
        run: scripts/sobelow.sh

      # The PLT encodes OTP + deps; rebuilding it cold takes minutes, so it is
      # cached on the exact beam versions + lockfile. mix.exs pins its path to
      # priv/plts for this cache. restore-keys deliberately omitted: a PLT from
      # different versions would be rebuilt anyway.
      - name: Restore dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      # MIX_ENV=dev on purpose (the job env is test): dialyzer analyzes the
      # shipped code; the test env would drag test/support and test-only deps
      # into the analysis and the PLT.
      - name: Dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The CLI had tests since launch that no workflow ever ran, so they gated
      # neither a merge nor a release.
      - name: CLI tests
        working-directory: cli
        run: go test ./...

      - name: CLI vet
        working-directory: cli
        run: go vet ./...

      # The Hermes plugin (integrations/hermes) is stdlib Python; its tests
      # run against an in-process fake Fountain and need nothing installed.
      - name: Hermes plugin tests
        run: python3 -m unittest discover -s integrations/hermes/tests -v

      # The Python SDK is deliberately stdlib-only, so its source tests run
      # on the same interpreter without an install step.
      - name: Python SDK tests
        run: python3 -m unittest discover -s sdk/python/tests -v

      - name: Python SDK compiles
        run: python3 -m compileall -q sdk/python/src

      # The TypeScript SDK (sdk/typescript). Node runs the .ts sources
      # directly, so `npm test` needs nothing but the dev dependency on tsc —
      # which is also what enforces `erasableSyntaxOnly`, the setting that
      # keeps those sources runnable without a build step.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci

      - name: SDK typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: SDK tests
        working-directory: sdk/typescript
        run: npm test

      - name: SDK build
        working-directory: sdk/typescript
        run: npm run build

      # `gofmt -l` prints offending files and exits 0, so the failure has to
      # come from the emptiness check — print the list first so the log says
      # which files to run gofmt on.
      - name: CLI gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # For the release boot check below, not for a test suite — this job runs
      # none. /health/ready and the release task below both read the database.
      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Builds a release and runs its config providers. Config.Reader tests
      # validate config *values*; only a real boot catches a key that may not be
      # set at runtime at all. A `force_ssl` moved into runtime.exs passed every
      # test and then CrashLoopBackOff'd every pod with:
      #   ERROR! the application :fountain has a different value set for path
      #   [:force_ssl] inside key FountainWeb.Endpoint during runtime compared
      #   to compile time.
      # Two distinct failures have shipped past every other check here, one
      # after the other, from the same change:
      #
      #   1. force_ssl set from runtime.exs failed validate_compile_env and the
      #      node aborted during boot.
      #   2. the node then booted fine and Plug.SSL 301'd every kubelet probe,
      #      so no pod ever became ready.
      #
      # From outside they look identical — pods not Ready, rollout stalled — and
      # neither is visible to a Config.Reader test or to `mix test`. So this
      # boots a real release with production-shaped config and then asks it the
      # questions kubelet asks: over plain http, on the pod's own port, with no
      # proxy and no X-Forwarded-Proto.
      #
      # The Host header matters more than the address. Plug.SSL's default
      # exclude is [hosts: ["localhost", "127.0.0.1"]], so a probe sent to
      # either name is never redirected and this check would pass while
      # production 301s. kubelet dials the pod IP, which is in neither list, so
      # the probe carries a pod-shaped Host to reproduce that.
      - name: Release boots and answers its health probes
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          PORT: "4000"
          SECRET_KEY_BASE: ci-only-not-a-secret-000000000000000000000000000000000000000000000000
          # 43 chars of base64url = 32 zero bytes. Valid format, obviously not a key.
          MASTER_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: postgres://postgres:postgres@localhost/fountain_test
          # The CI Postgres service serves no TLS, and DATABASE_SSL defaults on
          # in prod — without this the release dies on a connection timeout and
          # the step fails for a reason that has nothing to do with the app.
          DATABASE_SSL: "false"
          PUBLIC_URL: https://ci.example.com
          EMAIL_DELIVERY: none
          # No collector on a runner; without this the exporter retries per span.
          OTEL_TRACES_EXPORTER: none
        run: |
          set -euo pipefail
          mix deps.get --only prod
          mix release fountain_server --overwrite

          # Config providers run here. A key that may not be set at runtime
          # aborts boot at this point rather than serving anything.
          _build/prod/rel/fountain_server/bin/fountain_server eval 'IO.puts("config ok")'

          _build/prod/rel/fountain_server/bin/fountain_server daemon
          trap '_build/prod/rel/fountain_server/bin/fountain_server stop || true' EXIT

          probe() {
            # Exactly, not "2xx or 3xx". A 301 is what broke production: curl
            # -f does not fail on a redirect, so the status has to be compared.
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.42.0.1' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ] && [ "$code" != "502" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }

          probe /health
          probe /health/ready

          # Release tasks must be runnable while the server owns the ports,
          # and without PHX_SERVER — the shape they actually run in, both
          # in-pod and via compose exec. A release task once booted the
          # entire app from eval and died on eaddrinuse against a running
          # server; with PHX_SERVER=false the repo had no config at all.
          # Both regressions fail exactly here.
          echo "release task runs beside the live server:"
          PHX_SERVER=false _build/prod/rel/fountain_server/bin/fountain_server \
            eval 'Fountain.Release.rebuild_credit_lots()'

      - name: Validate OpenAPI spec
        run: mix openapi.spec.json --spec FountainWeb.ApiSpec --output /tmp/openapi.json && jq empty /tmp/openapi.json

      # The SDK's types are generated from that spec, not written by hand, so
      # a schema change in Elixir must reach `sdk/typescript/src/generated`.
      # Regenerating here and failing on a diff is what keeps them the same
      # thing rather than two descriptions of the API that drift apart.
      - name: SDK types match the spec
        run: |
          mix openapi.spec.json --spec FountainWeb.ApiSpec --vendor-extensions=false \
            --output /tmp/sdk-openapi.json
          cd sdk/typescript
          FOUNTAIN_OPENAPI=/tmp/sdk-openapi.json npm run generate
          if ! git diff --exit-code src/generated/openapi.ts; then
            echo "::error::sdk/typescript/src/generated/openapi.ts is stale." >&2
            echo "Run 'npm run generate' in sdk/typescript and commit the result." >&2
            exit 1
          fi

      # Eleven browser applications are built on this API, so the SDK's default
      # entry has to bundle for a browser — no Node built-ins reachable from it.
      - name: SDK bundles for the browser
        working-directory: sdk/typescript
        run: npx --yes esbuild dist/index.js --bundle --platform=browser --format=esm --outfile=/dev/null

      # The complement of the `docs` job. That job carries the prose gates for
      # a docs-ONLY diff; this carries them for a diff that touches docs AND
      # code, which took neither branch before and so went unchecked until
      # docs.yml ran on main. The two jobs are mutually exclusive by the same
      # docs_only gate.
      #
      # The structural half of the gate — every page the nav names, every page
      # on disk, every internal /docs link and every anchor — lives in
      # docs_test.exs and runs in the Elixir suite, so it needs nothing here.
      # That is what `mkdocs build --strict` used to carry, and the test is the
      # stronger of the two: MkDocs never checked anchors (#1008).
      - name: Docs style
        if: ${{ needs.changes.outputs.docs_touched == 'true' }}
        run: python3 scripts/docs-style.py

      # A pinned release binary, not `go install`. This job pins Go from
      # cli/go.mod with GOTOOLCHAIN=local, so it cannot fetch the newer
      # toolchain the linter's module requires, and `go install` fails before
      # the linter ever runs. The tarball needs no toolchain and is verified
      # against its published SHA256.
      - name: Install the STE linter
        if: ${{ needs.changes.outputs.docs_touched == 'true' }}
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/vale.tar.gz" \
            https://github.com/stuffbucket/vale/releases/download/v0.15.0/vale_0.15.0_linux_amd64.tar.gz
          echo "c6b85fd4da8ca2b0f631b17556c3f38bc3f30e9ce636517c00ad507c522c2a5c  ${RUNNER_TEMP}/vale.tar.gz" \
            | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/vale"
          tar -xzf "${RUNNER_TEMP}/vale.tar.gz" -C "${RUNNER_TEMP}/vale" vale
          "${RUNNER_TEMP}/vale/vale" version
          echo "${RUNNER_TEMP}/vale" >> "$GITHUB_PATH"

      - name: Docs Simplified Technical English
        if: ${{ needs.changes.outputs.docs_touched == 'true' }}
        run: vale lint docs

      # AI-writing tells, the third prose gate beside the style sheet and STE.
      # The engine is the published `sentences` package (lex00/sentences, MIT);
      # scripts/destink/destink.mjs holds the rule set, with the count each
      # enabled and disabled rule produced over docs/. No setup-node here: this
      # job already installed Node 24 for the SDK steps above, unconditionally.
      # A second setup-node would re-point the npm cache at a different
      # lockfile for the rest of the job.
      - name: Docs de-stink
        if: ${{ needs.changes.outputs.docs_touched == 'true' }}
        run: |
          npm ci --prefix scripts/destink
          node scripts/destink/destink.mjs

  compose-fresh-clone:
    name: Compose fresh-clone check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Regression guard for #392: compose interpolates the entire file at
      # load time regardless of which service a command targets, so a
      # `:?`-required variable anywhere in it aborted even the documented
      # database-only dev path (`docker compose up -d postgres`) on a fresh
      # clone with no .env. This is the same load step that command runs.
      - name: docker compose config with no .env and no secrets in the environment
        run: env -u SECRET_KEY_BASE -u MASTER_SECRETS_KEY docker compose config --quiet

  # docker-compose.yml and .env.compose.example evolve on main while the
  # image they run stays pinned to a released tag. Every other check pairs
  # main's config with main's code — ComposePassthroughConfigTest evaluates
  # main's runtime.exs, the release boot check boots a fresh build. The
  # pairing a fresh `git clone && docker compose up` actually gets — current
  # compose file, *pinned* image — was exercised by nothing, and both #513
  # boot failures shipped through exactly that gap (#548). So this job runs
  # the documented quick start verbatim against the pin and asks the app
  # what the walkthrough asks.
  compose-pinned-image-boot:
    name: Compose boots the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # A release bump pins the tag it is about to create, so on the bump PR
      # (and on main until release.yml has published the image) the pin
      # names an image that does not exist yet. That is the one legitimate
      # reason for the pull to fail, and it failed twice at v0.15.0: once on
      # the PR by construction, and once on main, where the red CI run kept
      # build.yml from building the bump commit and prod's footer stayed on
      # the previous version (#1329). When the pin matches the version in
      # mix.exs and the registry has no image for it, this tree is that
      # bump: skip here, and release.yml runs the same script on the tag once
      # the image is up. Any other missing image is a broken quick start.
      - name: Resolve the pinned image
        id: pin
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/^FOUNTAIN_IMAGE_TAG=(v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .env.compose.example)"
          version="$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | head -1 \
            | sed -E 's/version: "([0-9.]+)"/\1/')"
          echo "pinned ${pin}; mix.exs is ${version}"
          if docker manifest inspect "ghcr.io/binarybourbon/fountain:${pin}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${pin}" = "v${version}" ]; then
            echo "::notice::${pin} has no image yet (release bump); release.yml boots it on the tag"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "the quick start pins ${pin}, which has no image in the registry" >&2
          exit 1

      - name: Run the documented quick start and probe the app
        if: ${{ steps.pin.outputs.exists == 'true' }}
        run: scripts/compose-boot-check.sh

      - name: Dump container logs
        if: ${{ failure() && steps.pin.outputs.exists == 'true' }}
        run: docker compose logs --timestamps

  # What a docs-only PR runs instead of the three test partitions, the
  # coverage merge, static analysis and the two compose checks. It is not a
  # weaker gate for docs, it is a stronger one: the docs gate did not run on a
  # pull request at all before this job existed — the GitHub Pages workflow was
  # push-to-main only — so a broken relative link or a page missing from the
  # nav passed CI and failed after the merge, on main, where nobody was
  # looking. That workflow is gone (#1008); this job is the gate.
  #
  # The compile step is the load-bearing one. Fountain.Docs embeds every page
  # at compile time, so a snippet include pointing at a file that is not there
  # kills `mix compile` — and, in the image, `mix release`, which is how #884
  # shipped a commit that built no image at all while CI stayed green. The
  # Dockerfile-COPY coverage test that now guards that lives in docs_test.exs
  # and runs here.
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Shares the `test` job's cache keys on purpose. The warning against
      # sharing a key (see the `test` job) is about two jobs racing to save
      # mutually incomplete trees under one name — that cannot happen here,
      # because this job and the partitions are mutually exclusive by
      # construction: docs_only gates one set or the other, never both. Same
      # :test tree, so this job warms from their archive and back into it.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Embedding happens here: a bad snippet path or an unreadable page fails
      # this step, which is the whole reason a docs change cannot skip Elixir
      # entirely.
      - name: Compile
        run: mix compile --warnings-as-errors

      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # docs_test.exs: the docs/nav.yml parser, the snippet-to-Dockerfile COPY
      # coverage, the dialect preprocessing, and every internal /docs link and
      # anchor. Since #1008 it is the whole structural gate — there is no
      # second renderer to build the pages strictly against.
      # docs_controller_test.exs: that the pages actually serve.
      - name: Docs tests
        run: mix test apps/fountain/test/fountain/docs_test.exs apps/fountain/test/fountain_web/controllers/docs_controller_test.exs

      # The style sheet in standards/voice-and-style.md, enforced. It
      # skips the backlog in scripts/docs-style-allow.txt, so a file NOT on
      # that list is checked and every new page is covered by default.
      - name: Docs style
        run: python3 scripts/docs-style.py

      # ASD-STE100 Simplified Technical English, the standard in
      # standards/simplified-technical-english.md. Config in
      # .vale-ste.yml, backlog in .valeignore, and the backlog only shrinks.
      # A pinned release binary, not `go install`. This job pins Go from
      # cli/go.mod with GOTOOLCHAIN=local, so it cannot fetch the newer
      # toolchain the linter's module requires, and `go install` fails before
      # the linter ever runs. The tarball needs no toolchain and is verified
      # against its published SHA256.
      - name: Install the STE linter
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/vale.tar.gz" \
            https://github.com/stuffbucket/vale/releases/download/v0.15.0/vale_0.15.0_linux_amd64.tar.gz
          echo "c6b85fd4da8ca2b0f631b17556c3f38bc3f30e9ce636517c00ad507c522c2a5c  ${RUNNER_TEMP}/vale.tar.gz" \
            | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/vale"
          tar -xzf "${RUNNER_TEMP}/vale.tar.gz" -C "${RUNNER_TEMP}/vale" vale
          "${RUNNER_TEMP}/vale/vale" version
          echo "${RUNNER_TEMP}/vale" >> "$GITHUB_PATH"

      - name: Docs Simplified Technical English
        run: vale lint docs

      # AI-writing tells, the third prose gate beside the style sheet and STE.
      # The engine is the published `sentences` package (lex00/sentences, MIT);
      # scripts/destink/destink.mjs holds the rule set, with the count each
      # enabled and disabled rule produced over docs/.
      - name: Set up Node for the de-stink gate
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/destink/package-lock.json

      - name: Docs de-stink
        run: |
          npm ci --prefix scripts/destink
          node scripts/destink/destink.mjs

      - name: Set up Go
        if: ${{ needs.changes.outputs.cli_docs == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # docs/cli.md is diffed against the real command tree, so it is the one
      # docs page whose guard lives in the Go suite rather than the Elixir one.
      - name: CLI docs parity
        if: ${{ needs.changes.outputs.cli_docs == 'true' }}
        working-directory: cli
        run: go test ./internal/cmd -run 'TestEveryCommandIsDocumented|TestNoDocumentedCommandIsInvented|TestGeneratedCLIReferenceIsCurrent'
