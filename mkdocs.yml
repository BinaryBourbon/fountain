site_name: Fountain
site_description: Multi-tenant API and UI for managing agents, environments, and secrets.
site_url: https://binarybourbon.github.io/fountain
repo_url: https://github.com/BinaryBourbon/fountain
repo_name: BinaryBourbon/fountain
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  # Lets docs/changelog.md include the repo-root CHANGELOG.md. base_path is
  # relative to the directory mkdocs runs from, i.e. the repo root — both
  # docs.yml and a local `mkdocs serve` invoke it there.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# ── This nav is the only copy ──────────────────────────────────────────────
# The app serves these same pages at /docs and PARSES this block at compile
# time (Fountain.Docs, via Compiler.parse_nav/1), so adding or renaming a page
# is a one-file change. It used to be mirrored in @nav in
# apps/fountain/lib/fountain/docs.ex with a test diffing the two, which is how
# docs-only PRs kept going red in CI partition 3.
#
# A line this file's parser cannot read raises at compile time rather than
# being skipped — a page silently missing from /docs is the failure being
# prevented. Keep to the two shapes below: `  - Title: file.md` for a page and
# a `  - Section:` header with six-space-indented children.
#
# Also: `mkdocs build --strict` fails on a broken relative link, and
# docs/cli.md is diffed against the real CLI command tree.
nav:
  - Home: index.md
  - Guided tour — opening a PR: tour.md
  - Concepts:
      - The four primitives: primitives.md
      - Environment: concepts/environment.md
      - Vault: concepts/vault.md
      - Agent: concepts/agent.md
      - Conversation: concepts/conversation.md
      - Agents as teammates: concepts/teammates.md
      - Architecture: architecture.md
  - Setup: setup.md
  - Run an instance:
      - Self-hosting: self-hosting.md
      - Deploy an instance: guides/operate/deploy.md
      - Put it on the internet: guides/operate/put-it-on-the-internet.md
      - Connect a database: guides/operate/database.md
      - Deploy on Kubernetes: guides/operate/kubernetes.md
      - Configure email: guides/operate/email.md
      - Change sandbox lifetimes: guides/operate/sandbox-lifetime.md
      - Turn on billing: guides/operate/billing.md
      - Back up and restore: guides/operate/back-up-and-restore.md
      - Upgrade an instance: guides/operate/upgrade.md
      - Wire up observability: guides/operate/observability.md
      - Run a release task: guides/operate/run-a-release-task.md
      - Operations overview: operations.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - A conversation is stuck or failed: troubleshooting/conversation-stuck-or-failed.md
      - Sandbox errors: troubleshooting/sandbox-errors.md
      - Pods restarting or not ready: troubleshooting/pods-restarting.md
      - Nobody can log in: troubleshooting/nobody-can-log-in.md
  - Configuration reference: configuration.md
  - Sandbox providers:
      - The contract: integrations/sandbox-contract.md
      - Sprites: integrations/sprites.md
      - Sprites transport reference: integrations/sprites-contract.md
      - E2B: integrations/e2b.md
      - Daytona: integrations/daytona.md
      - Self-hosted runners: integrations/runners.md
      - Adding a provider: integrations/adding-a-sandbox-provider.md
  - Services Fountain uses:
      - Overview: integrations/index.md
      - Mail: integrations/mail.md
      - GitHub OAuth: integrations/github-oauth.md
      - Stripe: integrations/stripe.md
      - Sentry: integrations/sentry.md
  - Reference:
      - CLI: cli.md
      - API: api.md
      - TypeScript SDK: sdk.md
      - Conversation states: reference/conversation-states.md
      - Glossary: reference/glossary.md
  - Build a chat app:
      - The shape everyone is cloning: build/index.md
      - A team chat, end to end: build/team-chat.md
      - What each piece does: build/pieces.md
  - Plugging into Fountain:
      - Overview: integrations/clients.md
      - fountain acp (reference): integrations/acp.md
      - Editors (ACP): integrations/editors.md
      - OpenClaw (ACP): integrations/openclaw.md
      - Hermes Agent (plugin): integrations/hermes.md
      - OpenBot (AG-UI): integrations/openbot.md
      - Buzz (Nostr): integrations/buzz.md
      - LLM integration: llm-integration.md
  - Changelog: changelog.md
