name: Release

# Builds the Go CLI under cli/, publishes the version-tagged server
# image, and attaches binaries to a GitHub Release. Triggered by
# pushing a v*.*.* tag, or manually via workflow_dispatch with an
# existing tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (must already exist on a commit)."
        required: true

env:
  GO_VERSION: "1.25.0"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: fountain-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: fountain-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: fountain-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: fountain-darwin-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      # A release used to cross-compile without ever running the suite, so a
      # binary could ship with failing tests. Run once on the host platform —
      # cross-compiled test binaries cannot be executed here anyway.
      - name: Test
        working-directory: cli
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        working-directory: cli
        run: |
          set -euxo pipefail
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w" -o "../dist/${{ matrix.artifact }}" ./cmd/fountain
          file "../dist/${{ matrix.artifact }}"
          du -h "../dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Same service + env shape as ci.yml's test job: the spec renders from
    # the compiled app, and app start is verified against this exact setup.
    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # openapi.export boots the app, and since Oban arrived (#217) boot
      # requires the oban_jobs table — an unmigrated database aborts startup.
      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Export spec
        working-directory: apps/fountain
        run: mix openapi.export

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi.json
          path: dist/openapi.json

  image:
    # The server image is built fresh from the tag's tree rather than
    # re-tagging the sha- image build.yml already pushed, for two reasons:
    # the tag points at release-bump's version commit, which build.yml never
    # built ([skip ci] + GITHUB_TOKEN suppression), and the mix.exs version
    # baked into the image is surfaced in-app — it must match the tag.
    #
    # Tags: vX.Y.Z is immutable; vX.Y moves to the newest patch in its line.
    # :latest continues to track main via build.yml and is not touched here.
    name: Publish versioned server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${tag}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "minor=${tag%.*}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The tag's commit, explicitly — a workflow_dispatch runs on the
          # ref it was dispatched from, which need not be the tag.
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve build sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.sha }}
          tags: |
            ghcr.io/binarybourbon/fountain:${{ steps.tag.outputs.tag }}
            ghcr.io/binarybourbon/fountain:${{ steps.tag.outputs.minor }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # image is a needs so a release is never published without its image —
    # the release page is what tells a self-hoster the tag exists to pin.
    needs: [build, openapi, image]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/fountain-linux-amd64/fountain-linux-amd64
            artifacts/fountain-linux-arm64/fountain-linux-arm64
            artifacts/fountain-darwin-amd64/fountain-darwin-amd64
            artifacts/fountain-darwin-arm64/fountain-darwin-arm64
            artifacts/openapi.json/openapi.json
          fail_on_unmatched_files: true

  bump-tap:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          for a in fountain-darwin-amd64 fountain-darwin-arm64 fountain-linux-amd64 fountain-linux-arm64; do
            sum=$(sha256sum "artifacts/${a}/${a}" | awk '{print $1}')
            key=$(echo "${a#fountain-}" | tr - _)
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout tap repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: BinaryBourbon/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          cat > tap/Formula/fountain.rb <<EOF
          class Fountain < Formula
            desc "CLI for Fountain — HTTP/JSON client, SSE consumer, and secret-store helper"
            homepage "https://github.com/BinaryBourbon/fountain"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/BinaryBourbon/fountain/releases/download/${TAG}/fountain-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/BinaryBourbon/fountain/releases/download/${TAG}/fountain-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/BinaryBourbon/fountain/releases/download/${TAG}/fountain-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/BinaryBourbon/fountain/releases/download/${TAG}/fountain-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              arch = Hardware::CPU.arm? ? "arm64" : "amd64"
              os = OS.mac? ? "darwin" : "linux"
              bin.install "fountain-#{os}-#{arch}" => "fountain"
            end

            test do
              assert_match "fountain", shell_output("#{bin}/fountain --help")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "fountain-release-bot"
          git config user.email "noreply@github.com"
          if git diff --quiet -- Formula/fountain.rb; then
            echo "Formula already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git add Formula/fountain.rb
          git commit -m "fountain ${TAG}"
          git push
