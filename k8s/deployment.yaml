# Strategic-merge patch over the baseline Deployment (../deploy/k8s). Only
# what is personal lives here; probes, securityContext, resources and the
# rollout strategy come from the base and are deliberately not repeated.
#
# This file keeps its name and its image line even though it is now a patch:
# publish-manifests.yml seds `ghcr.io/binarybourbon/fountain:sha-…` in
# k8s/deployment.yaml inside the OCI manifest artifact. See kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain
  namespace: fountain
  annotations:
    # When the Infisical operator rotates the `fountain-secrets` Secret
    # the operator restarts this Deployment so the new values take
    # effect. The Phoenix release reads env at boot, not per-request.
    secrets.infisical.com/auto-reload: "true"
spec:
  # Two replicas for HA. This is only safe because the pods form a real
  # Erlang cluster: libcluster (DNSPoll against the fountain-headless
  # Service) connects the BEAM nodes, which lets Horde route per-conversation
  # ConversationServers cluster-wide and Phoenix.PubSub fan `conv:<id>`
  # events across pods. Without that wiring (RELEASE_DISTRIBUTION/RELEASE_NODE/
  # RELEASE_COOKIE/CLUSTER_DNS_QUERY below + the headless Service) two pods
  # run as isolated islands and conversation streaming silently breaks for
  # whichever pod didn't spawn the conversation. CNPG remains the single
  # writer — the app tier is the stateless part being scaled here.
  replicas: 2
  template:
    spec:
      containers:
        - name: fountain
          # Inert in git. Flux deploys the OCI artifact at
          # ghcr.io/binarybourbon/fountain-manifests, and publish-manifests.yml
          # rewrites this line in the artifact — on the tree that was actually
          # built, with the tag built from it. The value below is whatever was
          # last committed here and is not what runs. See #231, #304.
          image: ghcr.io/binarybourbon/fountain:sha-b1e612b6fdcb844514e67e1a00a8a84bcdec0147
          ports:
            # Erlang distribution: epmd + the pinned dist port (see
            # ERL_AFLAGS). Informational here, but lets a future
            # NetworkPolicy reference them by name.
            - name: epmd
              containerPort: 4369
            - name: erldist
              containerPort: 9100
          env:
            # --- Erlang clustering (required for >1 replica) ---
            # Pod IP via the downward API; RELEASE_NODE interpolates it
            # below. Must be declared before any env that references
            # $(POD_IP) — k8s only substitutes vars defined earlier.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: name
            # Node name MUST use the release name `fountain_server` as its
            # basename: libcluster's DNSPoll derives the peer node name from
            # RELEASE_NAME (= fountain_server in the release), so a mismatched
            # basename here means peers are discovered but never connect.
            - name: RELEASE_NODE
              value: fountain_server@$(POD_IP)
            # Shared Erlang cookie so the nodes accept each other's
            # connections. Reuses SECRET_KEY_BASE — already identical across
            # all pods and present in fountain-secrets — to avoid a separate
            # Infisical key that, if missing, would let each pod generate a
            # random cookie and silently fail to cluster. Swap to a dedicated
            # RELEASE_COOKIE key here if you'd rather not reuse it.
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: fountain-secrets
                  key: SECRET_KEY_BASE
            # Pin the distribution listener to a single port so it's
            # firewall/NetworkPolicy-friendly (epmd otherwise hands out a
            # random high port per boot).
            - name: ERL_AFLAGS
              value: "-kernel inet_dist_listen_min 9100 inet_dist_listen_max 9100"
            # Headless Service FQDN libcluster polls to discover peer pods.
            - name: CLUSTER_DNS_QUERY
              value: fountain-headless.fountain.svc.cluster.local
            # CNPG-generated `fountain-pg-app` Secret. `uri` is the
            # postgres://user:pass@host:port/db URL Ecto consumes
            # directly via DATABASE_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fountain-pg-app
                  key: uri
            # PUBLIC_URL is the absolute base for outbound links (verification
            # and reset emails, llms.txt) and for FOUNTAIN_BASE_URL inside every
            # sprite. PHX_HOST is the bare host for the endpoint and
            # check_origin. FOUNTAIN_DOMAIN is kept only so a rollback to an
            # image predating the split still boots with the right host.
            - name: PUBLIC_URL
              value: https://fountain.inevitable.fyi
            - name: PHX_HOST
              value: fountain.inevitable.fyi
            - name: FOUNTAIN_DOMAIN
              value: fountain.inevitable.fyi
            - name: EMAIL_FROM
              value: noreply@updates.inevitable.fyi
            # The app defaults BILLING_ENABLED to false (#336) so a stock
            # self-host install never hits ADR 0006's gate with no key. This
            # hosted instance is the deployment that opts in.
            - name: BILLING_ENABLED
              value: "true"
            # TODO(#500): before billing launch, set LEGAL_ENTITY,
            # LEGAL_CONTACT_EMAIL, LEGAL_JURISDICTION, LEGAL_EFFECTIVE_DATE
            # (#517) — until then /terms and /privacy render loud
            # {{COMPANY_LEGAL_NAME}} placeholders and boot logs a warning.
            # Display-only price for the admin billing overview's MRR tile
            # (#286). Matches the live price (price_1TVSgwDbTpLaSfbPV8fLtPT9,
            # $29/mo as of 2026-08-02) — the API only exposes the price *id*,
            # so the amount is stated here. Update alongside any price change.
            - name: STRIPE_PRICE_MONTHLY_CENTS
              value: "2900"
            # Deliberate unverified accounts (operator tests) survive the
            # unverified-account pruner (#258).
            - name: UNVERIFIED_PRUNE_EXEMPT
              value: jhgaylor
            # TRUSTED_PROXIES is deliberately NOT set. Public traffic arrives
            # via the Cloudflare Tunnel (home-cloud k8s/cloudflared/), so the
            # X-Forwarded-For chain is "client, <cloudflared pod>" — every
            # proxy hop is inside the pod network, which the app's built-in
            # default trust list already covers. (Cloudflare egress ranges
            # were listed here briefly; the tunnel made them unnecessary —
            # CF's own addresses never appear as hops.)
            # No OTLP collector in-cluster yet — without this,
            # opentelemetry_exporter retries localhost:4318 per span and
            # floods logs with :econnrefused. Swap to the real
            # OTEL_EXPORTER_OTLP_ENDPOINT once a collector is wired up.
            - name: OTEL_TRACES_EXPORTER
              value: "none"
          # Replaces the base's list (configMap + secret): this deployment has
          # no ConfigMap — non-secret config is the explicit env above, and
          # everything else comes from the Infisical-materialized Secret:
          #   SECRET_KEY_BASE, MASTER_SECRETS_KEY, SPRITES_TOKEN,
          #   GITHUB_OAUTH_CLIENT_ID/SECRET, STRIPE_*, RESEND_API_KEY,
          #   SENTRY_DSN. MASTER_SECRETS_KEY must never rotate casually —
          #   every envelope-encrypted value in the DB depends on it.
          envFrom:
            - secretRef:
                name: fountain-secrets
