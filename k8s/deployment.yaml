# Strategic-merge patch over the baseline Deployment (../deploy/k8s). Only
# what is personal lives here; probes, securityContext, resources and the
# rollout strategy come from the base and are deliberately not repeated.
#
# This file keeps its name and its image line even though it is now a patch:
# publish-manifests.yml seds `ghcr.io/binarybourbon/fountain:sha-…` in
# k8s/deployment.yaml inside the OCI manifest artifact. See kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain
  namespace: fountain
  annotations:
    # When the Infisical operator rotates the `fountain-secrets` Secret
    # the operator restarts this Deployment so the new values take
    # effect. The Phoenix release reads env at boot, not per-request.
    secrets.infisical.com/auto-reload: "true"
spec:
  # Two replicas for HA. This is only safe because the pods form a real
  # Erlang cluster: libcluster (DNSPoll against the fountain-headless
  # Service) connects the BEAM nodes, which lets Horde route per-conversation
  # ConversationServers cluster-wide and Phoenix.PubSub fan `conv:<id>`
  # events across pods. Without that wiring (RELEASE_DISTRIBUTION/RELEASE_NODE/
  # RELEASE_COOKIE/CLUSTER_DNS_QUERY below + the headless Service) two pods
  # run as isolated islands and conversation streaming silently breaks for
  # whichever pod didn't spawn the conversation. CNPG remains the single
  # writer — the app tier is the stateless part being scaled here.
  replicas: 2
  template:
    spec:
      containers:
        - name: fountain
          # Inert in git. Flux deploys the OCI artifact at
          # ghcr.io/binarybourbon/fountain-manifests, and publish-manifests.yml
          # rewrites this line in the artifact — on the tree that was actually
          # built, with the tag built from it. The value below is whatever was
          # last committed here and is not what runs. See #231, #304.
          image: ghcr.io/binarybourbon/fountain:sha-b1e612b6fdcb844514e67e1a00a8a84bcdec0147
          ports:
            # Erlang distribution: epmd + the pinned dist port (see
            # ERL_AFLAGS). Informational here, but lets a future
            # NetworkPolicy reference them by name.
            - name: epmd
              containerPort: 4369
            - name: erldist
              containerPort: 9100
          env:
            # Which commit this pod is running. Not baked into the image:
            # build.yml stopped passing BUILD_SHA so that an image built from
            # a tree is reusable for any commit with that tree, and this env
            # (which wins over the image's ENV) names the commit actually
            # deployed. publish-manifests.yml rewrites the value in the
            # artifact next to the image tag, and fails if it cannot — the
            # literal below is whatever was last committed here and is not
            # what runs, exactly like the image line above.
            #
            # It reaches the footer (FountainWeb.Layouts) and, more
            # importantly, the Sentry release (config/runtime.exs) — so a
            # wrong value here misattributes every error to the wrong commit.
            - name: FOUNTAIN_BUILD_SHA
              value: "0000000000000000000000000000000000000000"
            # --- Erlang clustering (required for >1 replica) ---
            # Pod IP via the downward API; RELEASE_NODE interpolates it
            # below. Must be declared before any env that references
            # $(POD_IP) — k8s only substitutes vars defined earlier.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: name
            # Node name MUST use the release name `fountain_server` as its
            # basename: libcluster's DNSPoll derives the peer node name from
            # RELEASE_NAME (= fountain_server in the release), so a mismatched
            # basename here means peers are discovered but never connect.
            - name: RELEASE_NODE
              value: fountain_server@$(POD_IP)
            # Shared Erlang cookie so the nodes accept each other's
            # connections. Reuses SECRET_KEY_BASE — already identical across
            # all pods and present in fountain-secrets — to avoid a separate
            # Infisical key that, if missing, would let each pod generate a
            # random cookie and silently fail to cluster. Swap to a dedicated
            # RELEASE_COOKIE key here if you'd rather not reuse it.
            - name: RELEASE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: fountain-secrets
                  key: SECRET_KEY_BASE
            # Pin the distribution listener to a single port so it's
            # firewall/NetworkPolicy-friendly (epmd otherwise hands out a
            # random high port per boot).
            - name: ERL_AFLAGS
              value: "-kernel inet_dist_listen_min 9100 inet_dist_listen_max 9100"
            # Headless Service FQDN libcluster polls to discover peer pods.
            - name: CLUSTER_DNS_QUERY
              value: fountain-headless.fountain.svc.cluster.local
            # CNPG-generated `fountain-pg-app` Secret. `uri` is the
            # postgres://user:pass@host:port/db URL Ecto consumes
            # directly via DATABASE_URL.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fountain-pg-app
                  key: uri
            # PUBLIC_URL is the absolute base for outbound links (verification
            # and reset emails, llms.txt) and for FOUNTAIN_BASE_URL inside every
            # sprite. PHX_HOST is the bare host for the endpoint and
            # check_origin. FOUNTAIN_DOMAIN is kept only so a rollback to an
            # image predating the split still boots with the right host.
            - name: PUBLIC_URL
              value: https://fountain.inevitable.fyi
            - name: PHX_HOST
              value: fountain.inevitable.fyi
            - name: FOUNTAIN_DOMAIN
              value: fountain.inevitable.fyi
            - name: EMAIL_FROM
              value: noreply@updates.inevitable.fyi
            # The app defaults BILLING_ENABLED to false (#336) so a stock
            # self-host install never hits ADR 0006's gate with no key. This
            # hosted instance is the deployment that opts in.
            - name: BILLING_ENABLED
              value: "true"
            # TODO(#500): before billing launch, set LEGAL_ENTITY,
            # LEGAL_CONTACT_EMAIL, LEGAL_JURISDICTION, LEGAL_EFFECTIVE_DATE
            # (#517) — until then /terms and /privacy render loud
            # {{COMPANY_LEGAL_NAME}} placeholders and boot logs a warning.
            # Display-only price of the CLOSED `legacy` plan, for the admin
            # billing overview's MRR tile (#286). Matches the flat price the
            # tiers replaced (price_1TVSgwDbTpLaSfbPV8fLtPT9, $29/mo as of
            # 2026-08-02) — the API only exposes the price *id*, so the amount
            # is stated here.
            #
            # The public plans do NOT read this: each carries its own display
            # price in `Fountain.Plans` (ADR 0026), and their price ids come
            # from STRIPE_PRICE_ID_SOLO / _TEAM / _SCALE in Infisical beside
            # STRIPE_PRICE_ID. `mix fountain.verify_plans` is what checks the
            # catalog's amounts against Stripe — run it after any price change.
            - name: STRIPE_PRICE_MONTHLY_CENTS
              value: "2900"
            # Deliberate unverified accounts (operator tests) survive the
            # unverified-account pruner (#258).
            - name: UNVERIFIED_PRUNE_EXEMPT
              value: jhgaylor
            # Browser clients on other origins call /api with a bearer key
            # (never a cookie — the plug refuses credentials cross-origin):
            # the jakegaylor.com apps (fountain-team #810 and siblings) and
            # the demo suite on *.inevitable.fyi (one exact origin per app;
            # the landing page demos.inevitable.fyi makes no API calls).
            - name: API_CORS_ORIGINS
              value: https://jakegaylor.com,https://arena.inevitable.fyi,https://tables.inevitable.fyi,https://reposage.inevitable.fyi,https://watchtower.inevitable.fyi,https://mission.inevitable.fyi,https://briefs.inevitable.fyi,https://mend.inevitable.fyi,https://rounds.inevitable.fyi
            # The same apps may "Sign in with Fountain" (OAuth code + PKCE,
            # #818). Redirect URIs are exact.
            - name: OAUTH_CLIENTS
              value: '[{"id":"fountain-conversations","name":"Fountain Conversations","redirect_uris":["https://jakegaylor.com/fountain-conversations/"]},{"id":"fountain-team","name":"Fountain Team","redirect_uris":["https://jakegaylor.com/fountain-team/"]},{"id":"dns-desk","name":"DNS Desk","redirect_uris":["https://jakegaylor.com/dns-desk/"]},{"id":"arena","name":"Arena","redirect_uris":["https://arena.inevitable.fyi/"]},{"id":"table-talk","name":"Table Talk","redirect_uris":["https://tables.inevitable.fyi/"]},{"id":"repo-sage","name":"Repo Sage","redirect_uris":["https://reposage.inevitable.fyi/"]},{"id":"watchtower","name":"Watchtower","redirect_uris":["https://watchtower.inevitable.fyi/"]},{"id":"mission-control","name":"Mission Control","redirect_uris":["https://mission.inevitable.fyi/"]},{"id":"briefing-room","name":"Briefing Room","redirect_uris":["https://briefs.inevitable.fyi/"]},{"id":"mend","name":"Mend","redirect_uris":["https://mend.inevitable.fyi/"]},{"id":"rounds","name":"Rounds","redirect_uris":["https://rounds.inevitable.fyi/"]}]'
            # SANDBOX_IDLE_TIMEOUT_MINUTES is back at the stock 60m default.
            # The 240m override (#664) existed because idle reclaim used to
            # destroy the sandbox — and the agent's working memory — while a
            # human-gated incident (estate-medic) waited on a PR review.
            # Since decisions/0017 an idle sandbox is suspended, not
            # destroyed, and waking it restores the agent intact.
            # TRUSTED_PROXIES is deliberately NOT set. Public traffic arrives
            # via the Cloudflare Tunnel (home-cloud k8s/cloudflared/), so the
            # X-Forwarded-For chain is "client, <cloudflared pod>" — every
            # proxy hop is inside the pod network, which the app's built-in
            # default trust list already covers. (Cloudflare egress ranges
            # were listed here briefly; the tunnel made them unnecessary —
            # CF's own addresses never appear as hops.)
            # --- Tracing (OTel -> Tempo) ---
            # Tempo runs in-cluster (home-cloud platform/tempo), keeping blocks
            # in garage under a 5 GiB bucket quota with 72h retention. This
            # replaces OTEL_TRACES_EXPORTER=none, which was here because
            # nothing was listening and opentelemetry_exporter retried
            # localhost:4318 per span, flooding the logs with :econnrefused.
            #
            # Setting an endpoint is the whole switch: runtime.exs flips
            # traces_exporter to :otlp as soon as one of
            # OTEL_EXPORTER_OTLP_ENDPOINT / HONEYCOMB_* is present (#317 made
            # "no target configured" mean "export nothing", so a self-hoster
            # who sets none of these still exports nowhere). The exporter
            # speaks OTLP over HTTP/protobuf, so this is Tempo's http receiver
            # port 4318 — not grpc's 4317.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: fountain
            # Pod identity on every span, so Grafana's Tempo -> Loki jump can
            # narrow from a slow span to that pod's logs: the tempo datasource
            # maps k8s.namespace.name / k8s.pod.name onto the namespace / pod
            # labels alloy puts on log lines. The Erlang SDK merges
            # OTEL_RESOURCE_ATTRIBUTES into the resource runtime.exs builds.
            # POD_NAME must be declared before the var that references it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=fountain,k8s.pod.name=$(POD_NAME)
          # Replaces the base's list (configMap + secret): this deployment has
          # no ConfigMap — non-secret config is the explicit env above, and
          # everything else comes from the Infisical-materialized Secret:
          #   SECRET_KEY_BASE, MASTER_SECRETS_KEY, SPRITES_TOKEN,
          #   GITHUB_OAUTH_CLIENT_ID/SECRET, STRIPE_*, RESEND_API_KEY,
          #   SENTRY_DSN. MASTER_SECRETS_KEY must never rotate casually —
          #   every envelope-encrypted value in the DB depends on it.
          envFrom:
            - secretRef:
                name: fountain-secrets
