name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # PRs only (#414): cancelling superseded MAIN runs meant a rapid merge
  # sequence could strand a code commit un-built — commit A's CI cancelled
  # by docs-only commit B, whose own HEAD^..HEAD build filter then reported
  # "nothing image-affecting", so A never produced an image and every check
  # stayed green. Main runs queue instead of cancelling.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Two kinds of Elixir job, not one. The test suite used to be ~4m30s of the
# ~6m50s a PR took, and every other gate — format, credo, sobelow, dialyzer, the
# Go CLI checks, the release boot probe — was queued behind or ahead of it in
# the same job while sharing nothing with it but the checkout. #619 split them
# so the suite runs alone on the critical path with the rest beside it.
#
# #620 then split the suite itself across three machines. ExUnit reported why:
#
#   Finished in 252.3 seconds (140.7s async, 111.6s sync)
#
# The async phase scales with cores; the sync phase does not — ExUnit runs
# `async: false` modules one at a time on one core once the async phase drains,
# and 55 of 198 modules are `async: false` for real reasons (Application.put_env
# in the config tests, set_mimic_global in 13 files, the ETS rate-limit table).
# No runner size crosses that floor; only separate OS processes do, because
# separate partitions are separate BEAMs. Split three ways the serial tail
# falls from 111.6s to roughly a third of it, and each partition gets its own
# Postgres rather than 2,423 tests sharing one 20-connection pool.
#
# The cost is that each partition instruments every module while exercising a
# third of the tests, so no partition's coverage means anything on its own.
# Hence the `coverage` job: partitions export, it merges, and the 85% threshold
# is enforced once against the union (see mix.exs / coverage.exs).
#
# On main, most of that is a re-run. PRs are squash-merged after a rebase, so
# the commit that lands on main usually has the *same tree* as the PR head —
# the exact tree the PR's CI run already passed (a rebased head contains
# main's tip, so the merge ref GitHub tested was the head itself). 10 of 12
# recent main commits were like that, and each spent ~10 minutes re-proving
# it before build.yml was allowed to start. The `already-tested` job checks
# for that case and, when it holds, lets every other job skip; the run still
# concludes `success`, which is all build.yml's workflow_run gate asks. Any
# doubt — no associated PR, a differing tree, no successful PR run, an API
# hiccup — falls through to the full run, never to a skip.
jobs:
  already-tested:
    name: Skip the re-run when a PR already tested this exact tree
    # Push-to-main only. On pull_request this job is skipped, its outputs are
    # empty, and the `!= 'true'` tests below let everything run as before.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read
      actions: read

    outputs:
      skip: ${{ steps.probe.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Compare this tree with the tested PR head
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        # Never fails: every branch of this script ends in a decision, and the
        # decision on any error is "run the full CI".
        run: |
          set -u
          skip=false
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "main tree: ${tree}"

          heads="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                     --jq '.[] | select(.merged_at != null) | .head.sha' 2>/dev/null || true)"
          if [ -z "${heads}" ]; then
            echo "no merged PR is associated with ${GITHUB_SHA:0:7} — running the full CI"
          fi

          for head in ${heads}; do
            if ! git fetch --quiet --depth=1 origin "${head}" 2>/dev/null; then
              echo "PR head ${head:0:7} could not be fetched"
              continue
            fi
            head_tree="$(git rev-parse "${head}^{tree}")"
            if [ "${head_tree}" != "${tree}" ]; then
              echo "PR head ${head:0:7} has tree ${head_tree:0:7} — differs; the merge produced a tree no PR run tested"
              continue
            fi
            # A completed, successful CI run on that head, triggered by the PR.
            # `status=success` excludes the cancelled runs that PR
            # cancel-in-progress leaves behind.
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&event=pull_request&status=success&per_page=50" \
                        --jq '[.workflow_runs[] | select(.name == "CI")] | first | .id // empty' 2>/dev/null || true)"
            if [ -z "${run_id}" ]; then
              echo "PR head ${head:0:7} has the same tree but no successful pull_request CI run"
              continue
            fi
            echo "PR head ${head:0:7} has the same tree and CI run ${run_id} passed on it — skipping the re-run"
            echo "tested by https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$GITHUB_STEP_SUMMARY"
            skip=true
            break
          done

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  test:
    name: Build and Test (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: already-tested
    # `!cancelled()` rather than the implicit success(): on pull_request the
    # gate job is skipped, and a skipped `needs` would skip this job too.
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    strategy:
      # Each partition is an independent verdict and all three are wanted: a
      # cancelled sibling would leave the coverage merge without its export and
      # turn one test failure into two unrelated-looking ones.
      fail-fast: false
      matrix:
        # The single source of truth for how many partitions there are — the
        # `--partitions` argument below is `strategy.job-total`, so adding an
        # entry here is the whole change.
        partition: [1, 2, 3]

    outputs:
      # Same value from every partition, so which one wins the race to set it
      # does not matter. The coverage job uses it to check that it merged an
      # export from every partition rather than from whichever ones uploaded.
      partitions: ${{ steps.total.outputs.count }}

    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Cache keys carry the job name. `test` and `checks` build different
      # trees — this one only ever compiles :test, while `checks` additionally
      # builds :dev for dialyzer and :prod for the release — and a shared key
      # would have them racing to save mutually incomplete archives under it,
      # winner decided by whichever finished first. Same reasoning as the
      # deliberately-narrow restore-keys below: a cache whose contents depend
      # on who got there first is the failure mode being avoided.
      #
      # The three partitions DO share a key, and that is not the same race:
      # they compile one identical :test tree and differ only in which test
      # files they load, so whichever wins the save has saved the same archive
      # the others would have. Giving each partition its own key would triple
      # the storage for identical content and stop them warming each other.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback: BEAM bytecode compiled by a different
          # OTP/Elixir is rebuilt from scratch anyway, and a cross-version
          # restore has produced subtle staleness — the same hazard the PLT
          # cache in `checks` avoids by omitting restore-keys entirely.
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Coverage instrumentation is free here — measured at 128.8s with cover
      # against 128.6s without, on the same machine. Running the suite bare on
      # PRs and gating coverage elsewhere would buy nothing and cost the gate.
      #
      # The script exists for the assertion, not for the mix invocation: with
      # partitioning, "ran zero tests" and "passed" are both exit 0, so it
      # parses ExUnit's summary line and refuses to succeed without one. See
      # the header of scripts/test-partition.sh.
      - name: Run tests with coverage
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: scripts/test-partition.sh ${{ strategy.job-total }}

      - name: Publish the partition count
        id: total
        run: echo "count=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverdata-${{ matrix.partition }}
          path: |
            apps/fountain/cover/${{ matrix.partition }}.coverdata
            apps/fountain/cover/${{ matrix.partition }}.tests
          # An export that silently fails to upload would leave the merge job
          # gating on a fraction of the suite while still printing a number.
          if-no-files-found: error
          retention-days: 1

  # The 85% gate, enforced once against all three partitions' data. It is a
  # separate job because there is nowhere else it can live: no partition can
  # see the others' coverage, and ExCoveralls — which this replaced in #620 —
  # had no way to merge across machines at all. Elixir's built-in cover does,
  # via the exports `mix test --partitions` writes.
  #
  # Deliberately light. `mix test.coverage` runs no tests and needs no
  # database — it imports .coverdata and reports — so this job is a checkout,
  # two cache restores and a few seconds of merging.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    # Still "after a green suite" — but spelled out, because test is skipped
    # (not failed) on the already-tested path and must not drag this along.
    if: ${{ !cancelled() && needs.test.result == 'success' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Both caches share the `test` job's keys: same tree, and by now the
      # partitions have already saved them, so this restores rather than
      # competes. The build cache is load-bearing, not a nicety — the task
      # itself compiles nothing, but Mix runs loadpaths underneath it and will
      # build the whole dependency tree into an empty _build first. Measured on
      # a 10-core machine: 3.7s warm, 38.5s cold.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Back into the directory the partitions wrote them from, which is where
      # `mix test.coverage` looks: it merges every *.coverdata under the
      # umbrella's children.
      - name: Download coverage exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: apps/fountain/cover

      # `mix test.coverage` reports on whatever exports it finds and says
      # nothing about the ones it did not. Two partitions' data would produce a
      # real-looking table with a number nobody could interpret, so the count
      # is checked before the threshold is trusted. Summing the per-partition
      # test counts is the same check from the other side, and puts the size of
      # the suite the gate stood on into the log.
      - name: Check every partition reported
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=${{ needs.test.outputs.partitions }}
          exports=(apps/fountain/cover/*.coverdata)
          if [ "${#exports[@]}" -ne "$expected" ]; then
            echo "merged ${#exports[@]} coverage exports, expected $expected" >&2
            exit 1
          fi
          total=$(cat apps/fountain/cover/*.tests | awk '{s += $1} END {print s + 0}')
          echo "merging ${#exports[@]} partitions covering $total tests"

      - name: Enforce the coverage threshold
        run: mix test.coverage

  checks:
    name: Static analysis and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    # Postgres is here for the release boot check alone: /health/ready calls
    # Fountain.Health.database/0, and the release task that runs after it
    # queries users. Both need a migrated fountain_test to answer honestly.
    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-checks-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-checks-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-checks-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-checks-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # --strict, matching `mix precommit`. CI used to run the default profile
      # while precommit ran --strict, so a strict violation passed CI and only
      # showed up for whoever ran precommit next.
      - name: Run Credo
        run: mix credo --strict

      - name: Audit dependencies
        # Deliberately non-blocking. A package can be retired upstream at any
        # moment by someone else, and that would break every build here for a
        # reason unrelated to the change under test. It stays visible in the
        # log. Currently flags earmark 1.4.48 (deprecated, unmaintained).
        continue-on-error: true
        run: mix hex.audit

      # Not plain `mix sobelow`: at the umbrella root sobelow detects no
      # Phoenix app, scans nothing, and exits 0 — indistinguishable from a
      # pass (#194, #311). The script scans a merged tree so ee/lib web
      # modules are covered too (decisions/0010).
      - name: Security scan (sobelow)
        run: scripts/sobelow.sh

      # The PLT encodes OTP + deps; rebuilding it cold takes minutes, so it is
      # cached on the exact beam versions + lockfile. mix.exs pins its path to
      # priv/plts for this cache. restore-keys deliberately omitted: a PLT from
      # different versions would be rebuilt anyway.
      - name: Restore dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      # MIX_ENV=dev on purpose (the job env is test): dialyzer analyzes the
      # shipped code; the test env would drag test/support and test-only deps
      # into the analysis and the PLT.
      - name: Dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The CLI had tests since launch that no workflow ever ran, so they gated
      # neither a merge nor a release.
      - name: CLI tests
        working-directory: cli
        run: go test ./...

      - name: CLI vet
        working-directory: cli
        run: go vet ./...

      # The Hermes plugin (integrations/hermes) is stdlib Python; its tests
      # run against an in-process fake Fountain and need nothing installed.
      - name: Hermes plugin tests
        run: python3 -m unittest discover -s integrations/hermes/tests -v

      # The TypeScript SDK (sdk/typescript). Node runs the .ts sources
      # directly, so `npm test` needs nothing but the dev dependency on tsc —
      # which is also what enforces `erasableSyntaxOnly`, the setting that
      # keeps those sources runnable without a build step.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci

      - name: SDK typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: SDK tests
        working-directory: sdk/typescript
        run: npm test

      - name: SDK build
        working-directory: sdk/typescript
        run: npm run build

      # `gofmt -l` prints offending files and exits 0, so the failure has to
      # come from the emptiness check — print the list first so the log says
      # which files to run gofmt on.
      - name: CLI gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # For the release boot check below, not for a test suite — this job runs
      # none. /health/ready and expire_legacy_trials both read the database.
      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Builds a release and runs its config providers. Config.Reader tests
      # validate config *values*; only a real boot catches a key that may not be
      # set at runtime at all. A `force_ssl` moved into runtime.exs passed every
      # test and then CrashLoopBackOff'd every pod with:
      #   ERROR! the application :fountain has a different value set for path
      #   [:force_ssl] inside key FountainWeb.Endpoint during runtime compared
      #   to compile time.
      # Two distinct failures have shipped past every other check here, one
      # after the other, from the same change:
      #
      #   1. force_ssl set from runtime.exs failed validate_compile_env and the
      #      node aborted during boot.
      #   2. the node then booted fine and Plug.SSL 301'd every kubelet probe,
      #      so no pod ever became ready.
      #
      # From outside they look identical — pods not Ready, rollout stalled — and
      # neither is visible to a Config.Reader test or to `mix test`. So this
      # boots a real release with production-shaped config and then asks it the
      # questions kubelet asks: over plain http, on the pod's own port, with no
      # proxy and no X-Forwarded-Proto.
      #
      # The Host header matters more than the address. Plug.SSL's default
      # exclude is [hosts: ["localhost", "127.0.0.1"]], so a probe sent to
      # either name is never redirected and this check would pass while
      # production 301s. kubelet dials the pod IP, which is in neither list, so
      # the probe carries a pod-shaped Host to reproduce that.
      - name: Release boots and answers its health probes
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          PORT: "4000"
          SECRET_KEY_BASE: ci-only-not-a-secret-000000000000000000000000000000000000000000000000
          # 43 chars of base64url = 32 zero bytes. Valid format, obviously not a key.
          MASTER_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: postgres://postgres:postgres@localhost/fountain_test
          # The CI Postgres service serves no TLS, and DATABASE_SSL defaults on
          # in prod — without this the release dies on a connection timeout and
          # the step fails for a reason that has nothing to do with the app.
          DATABASE_SSL: "false"
          PUBLIC_URL: https://ci.example.com
          EMAIL_DELIVERY: none
          # No collector on a runner; without this the exporter retries per span.
          OTEL_TRACES_EXPORTER: none
        run: |
          set -euo pipefail
          mix deps.get --only prod
          mix release fountain_server --overwrite

          # Config providers run here. A key that may not be set at runtime
          # aborts boot at this point rather than serving anything.
          _build/prod/rel/fountain_server/bin/fountain_server eval 'IO.puts("config ok")'

          _build/prod/rel/fountain_server/bin/fountain_server daemon
          trap '_build/prod/rel/fountain_server/bin/fountain_server stop || true' EXIT

          probe() {
            # Exactly, not "2xx or 3xx". A 301 is what broke production: curl
            # -f does not fail on a redirect, so the status has to be compared.
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.42.0.1' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ] && [ "$code" != "502" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }

          probe /health
          probe /health/ready

          # Release tasks must be runnable while the server owns the ports,
          # and without PHX_SERVER — the shape they actually run in, both
          # in-pod and via compose exec. expire_legacy_trials used to boot
          # the entire app from eval and die on eaddrinuse against a running
          # server; with PHX_SERVER=false the repo had no config at all.
          # Both regressions fail exactly here.
          echo "release task runs beside the live server:"
          PHX_SERVER=false _build/prod/rel/fountain_server/bin/fountain_server \
            eval 'Fountain.Release.expire_legacy_trials(dry_run: true)'

      - name: Validate OpenAPI spec
        run: mix openapi.spec.json --spec FountainWeb.ApiSpec --output /tmp/openapi.json && jq empty /tmp/openapi.json

      # The SDK's types are generated from that spec, not written by hand, so
      # a schema change in Elixir must reach `sdk/typescript/src/generated`.
      # Regenerating here and failing on a diff is what keeps them the same
      # thing rather than two descriptions of the API that drift apart.
      - name: SDK types match the spec
        run: |
          mix openapi.spec.json --spec FountainWeb.ApiSpec --vendor-extensions=false \
            --output /tmp/sdk-openapi.json
          cd sdk/typescript
          FOUNTAIN_OPENAPI=/tmp/sdk-openapi.json npm run generate
          if ! git diff --exit-code src/generated/openapi.ts; then
            echo "::error::sdk/typescript/src/generated/openapi.ts is stale." >&2
            echo "Run 'npm run generate' in sdk/typescript and commit the result." >&2
            exit 1
          fi

      # Eleven browser applications are built on this API, so the SDK's default
      # entry has to bundle for a browser — no Node built-ins reachable from it.
      - name: SDK bundles for the browser
        working-directory: sdk/typescript
        run: npx --yes esbuild dist/index.js --bundle --platform=browser --format=esm --outfile=/dev/null

  compose-fresh-clone:
    name: Compose fresh-clone check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Regression guard for #392: compose interpolates the entire file at
      # load time regardless of which service a command targets, so a
      # `:?`-required variable anywhere in it aborted even the documented
      # database-only dev path (`docker compose up -d postgres`) on a fresh
      # clone with no .env. This is the same load step that command runs.
      - name: docker compose config with no .env and no secrets in the environment
        run: env -u SECRET_KEY_BASE -u MASTER_SECRETS_KEY docker compose config --quiet

  # docker-compose.yml and .env.compose.example evolve on main while the
  # image they run stays pinned to a released tag. Every other check pairs
  # main's config with main's code — ComposePassthroughConfigTest evaluates
  # main's runtime.exs, the release boot check boots a fresh build. The
  # pairing a fresh `git clone && docker compose up` actually gets — current
  # compose file, *pinned* image — was exercised by nothing, and both #513
  # boot failures shipped through exactly that gap (#548). So this job runs
  # the documented quick start verbatim against the pin and asks the app
  # what the walkthrough asks.
  compose-pinned-image-boot:
    name: Compose boots the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # The exact commands the quick start documents (cp, the two openssl
      # lines, up) rather than a synthetic env — the job exists to run what
      # a fresh user runs, so any divergence here would defeat it. The
      # appended keys shadow the blank ones from the example file; that
      # last-value-wins reliance is part of the documented flow under test.
      - name: Run the documented quick start
        run: |
          set -euo pipefail
          cp .env.compose.example .env
          echo "SECRET_KEY_BASE=$(openssl rand -base64 48 | tr -d '\n')" >> .env
          echo "MASTER_SECRETS_KEY=$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '=\n')" >> .env
          docker compose up -d

      - name: Probe /health and /health/ready
        run: |
          set -euo pipefail
          probe() {
            # Boot runs migrations before the endpoint listens, so tolerate
            # refused connections while waiting — but a non-200 answer is a
            # verdict, not a retry.
            for _ in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }
          probe /health
          probe /health/ready

      - name: Dump container logs
        if: failure()
        run: docker compose logs --timestamps
