# ASD-STE100 Simplified Technical English, for docs/**/*.md.
#
# The standard is docs-redesign/08-simplified-technical-english.md. The linter
# is github.com/stuffbucket/vale, pinned in .github/workflows/ci.yml.
#
# The gate is `warning`. Six rules sit at or above it: sentence length,
# contractions, the passive voice, phrasal verbs, one instruction per sentence
# and the -ing form. The last one is a suggestion in the linter's defaults and
# this file raises it, because Rule 3.4 is not optional.
#
# STE.Vocabulary stays a suggestion. `vale lint --audit` prints it and the
# build does not fail on it. The reason is in the rules block below.

minSeverity: warning

rules:
  # ASD-STE100 Rule 3.4. Not a suggestion here.
  STE.IngForms:
    severity: warning

  # The official ASD-STE100 dictionary is licensed and the linter does not
  # bundle it. This rule approximates it from the OpenSTE wordset, which was
  # built for aircraft maintenance. Most of what it says is right. Some of it
  # is not right for software, and obeying that part makes a page worse rather
  # than plainer. It asks for "examine" in place of "search", "the two" in
  # place of "both", and "flush" in place of "running".
  #
  # So it advises rather than gates. Run `vale lint --audit docs` and read it.
  # Take the words it is right about, which are the ones every style guide
  # already names: via, however, require, provide, perform, utilize, should,
  # may, additional, prior to. Deliverable 8 lists them.
  STE.Vocabulary:
    severity: suggestion

# Report an unapproved word only when the wordset can name a replacement. The
# official ASD-STE100 dictionary is licensed and is not bundled with the
# linter, so a word with no suggestion is as likely to be a Technical Name as
# a mistake.
strictVocabulary: false

sentence:
  procedureMax: 20
  descriptionMax: 25

# Everything under docs/ is a published page, so everything under docs/ is
# linted. `docs/superpowers/**` used to be excluded here — planning material
# that MkDocs published and /docs did not. #1008 retired the MkDocs site and
# moved those pages to `superpowers/` at the repo root.
files:
  include:
    # One pattern per directory depth. On this walker `**` matches exactly
    # one directory, so `docs/**/*.md` alone does not match `docs/index.md`
    # (no directory) and does not match `docs/catalog/skills/fountain.md`
    # (two directories). The second gap was found in #1010: every page two
    # levels deep — all of `docs/catalog/*/` and `docs/guides/operate/` —
    # was silently outside the gate.
    - "docs/*.md"
    - "docs/**/*.md"
    - "docs/**/**/*.md"
  exclude:
    # A record of what happened, not a description of how the system works.
    # docs/changelog.md is a one-line snippet include of it.
    - "CHANGELOG.md"
    # Generated from the Cobra command tree by
    # cli/internal/cmd/docsgen_test.go. Its prose is the CLI's own help text,
    # so an edit here is undone by the next regeneration and the fix belongs
    # upstream in cli/internal/cmd/*.go. That is a change to what
    # `fountain --help` prints, which is CLI work rather than docs work.
    # scripts/docs-style.py makes the same exemption, for the same reason.
    - "docs/cli/commands.md"

vocabulary:
  builtinTechnicalTerms: true
  # Technical Names, which ASD-STE100 exempts from the dictionary. A word goes
  # here when it names a thing in this system or in one Fountain talks to. It
  # does not go here to escape a rewrite.
  allow:
    # The four primitives and the words the glossary fixes.
    - fountain
    - environment
    - vault
    - agent
    - conversation
    - sandbox
    - primitive
    - runtime
    - teammate
    - console
    # Fountain's own machinery.
    - sprite
    - sprites
    - reaper
    - rehydrator
    - substitution
    - envelope encryption
    - tenant
    - multi-tenant
    - prompt
    - system prompt
    - skill
    - turn
    - transcript
    - channel
    - thread
    - roster
    # Providers, services and protocols.
    - e2b
    - daytona
    - stripe
    - sentry
    - resend
    - postgres
    - postgresql
    - kubernetes
    - flux
    - cloudflare
    - github
    - oauth
    - pkce
    - acp
    - ag-ui
    - mcp
    - nostr
    - buzz
    - openclaw
    - openbot
    - hermes
    - claude
    - codex
    - gemini
    - opencode
    - anthropic
    - webhook
    - websocket
    - sse
    - rest
    - json
    - yaml
    - markdown
    - repo
    - repository
    - cli
    - sdk
    - api
    - ui
    - url
    - uuid
    - env
    - dek
    - adr
    # Gerunds that name a thing here, and page titles built from them. STE
    # exempts a Technical Name from Rule 3.4 the same way it exempts one from
    # the dictionary.
    - billing
    - logging
    - onboarding
    - troubleshooting
    - self-hosting
    - staging
    - clustering
    - monitoring
    - provisioning
    - versioning
    - streaming
    - polling
