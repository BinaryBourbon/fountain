# Alerts for Fountain.
#
# Routed by the existing home-cloud Alertmanager to ntfy: severity `warning`
# goes out at priority 3, `critical` at priority 4. Prometheus picks this up
# regardless of release label (ruleSelectorNilUsesHelmValues: false in the
# kube-prometheus-stack HelmRelease), matching k8s/monitoring/custom-alerts.yaml
# in home-cloud.
#
# Only gaps the upstream chart does not already cover. Node pressure, PVC fill,
# pod crash-looping and deployment-replica mismatch all ship with
# kube-prometheus-stack and are deliberately not duplicated here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fountain-alerts
  namespace: fountain
  labels:
    app: fountain
    app.kubernetes.io/part-of: home-cloud
spec:
  groups:
    # ── Backups ───────────────────────────────────────────────────────────
    #
    # The point of these: a backup CronJob that quietly stops is the classic
    # way backups rot. Nothing noticed for as long as it took to look, and by
    # then the newest artifact is however old the silence is.
    - name: fountain-backups
      interval: 60s
      rules:
        - alert: FountainBackupStale
          # kube_cronjob_status_last_successful_time is seconds since epoch of
          # the last *successful* run. 36h allows one missed nightly plus the
          # startingDeadlineSeconds window before shouting.
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="fountain", cronjob="fountain-pg-backup"
            } > 36 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Fountain Postgres backup has not succeeded in over 36h"
            description: |
              The last successful fountain-pg-backup run was
              {{ $value | humanizeDuration }} ago. The newest restorable dump in
              s3://fountain-backups/pg_dump/ is at least that old, so recovery
              would lose everything since.

              Check: kubectl get jobs -n fountain --sort-by=.metadata.creationTimestamp | tail
              Logs:  kubectl logs -n fountain job/<name> -c dump
                     kubectl logs -n fountain job/<name> -c upload
              Restore procedure: /help/runbook

        # The staleness alert above cannot fire if the CronJob has never run
        # even once — last_successful_time is simply absent, and `time() - absent`
        # is nothing rather than a large number.
        - alert: FountainBackupNeverSucceeded
          expr: |
            absent(kube_cronjob_status_last_successful_time{
              namespace="fountain", cronjob="fountain-pg-backup"
            })
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Fountain Postgres backup has never completed successfully"
            description: |
              No successful run has ever been recorded for fountain-pg-backup.
              Either the CronJob was just created and has not fired yet, or every
              run so far has failed. Either way there is no verified backup.

        - alert: FountainBackupJobFailing
          expr: |
            kube_job_status_failed{namespace="fountain", job_name=~"fountain-pg-backup.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A Fountain backup job failed"
            description: |
              {{ $labels.job_name }} has a failed pod. The nightly dump may not
              have been uploaded. A single failure is not yet data loss —
              FountainBackupStale escalates if it keeps happening.

        - alert: FountainBackupSuspended
          expr: kube_cronjob_spec_suspend{namespace="fountain", cronjob="fountain-pg-backup"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Fountain backup CronJob is suspended"
            description: |
              fountain-pg-backup is suspended, so no backups are being taken.
              This is fine during maintenance and dangerous if forgotten.

    # ── PITR (CNPG barman-cloud) ──────────────────────────────────────────
    #
    # The group above watches the pg_dump CronJob. This one watches the
    # other backup mechanism: continuous WAL archiving plus the nightly
    # 02:47 base backup through the barman-cloud plugin (objectstore.yaml +
    # scheduledbackup.yaml). None of the kube_cronjob_*/kube_job_* metrics
    # see any of it — CNPG's ScheduledBackup is a CRD, not a CronJob — so
    # these use the cnpg_* metrics the instance pod exports, scraped via
    # the PodMonitor that `monitoring.enablePodMonitor: true` in
    # postgres.yaml creates.
    - name: fountain-pitr
      interval: 60s
      rules:
        - alert: FountainPitrBaseBackupStale
          # last_available_backup_timestamp is seconds since epoch of the
          # newest completed base backup. The ScheduledBackup fires nightly
          # at 02:47; 26h allows one slow or late run before shouting.
          # Guarded on > 0 because before the first-ever backup the metric
          # is exported as 0, not absent — time() - 0 would fire this with
          # a nonsense age. FountainPitrBaseBackupNeverSucceeded owns that
          # case.
          expr: |
            (
              time() - cnpg_collector_last_available_backup_timestamp{namespace="fountain"}
                > 26 * 3600
            )
              and
            cnpg_collector_last_available_backup_timestamp{namespace="fountain"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CNPG base backup for fountain-pg is over 26h old"
            description: |
              The newest barman base backup is {{ $value | humanizeDuration }}
              old. WAL archiving may still be running, but recovery time grows
              with every hour of WAL replayed since the last base — and if the
              plugin is broken the WAL stream is probably rotting too.

              Check: kubectl get backups -n fountain --sort-by=.metadata.creationTimestamp | tail
                     kubectl get scheduledbackup -n fountain fountain-pg-base
              Logs:  kubectl logs -n fountain fountain-pg-1 -c plugin-barman-cloud
              The 03:17 pg_dump path is independent of this one and still
              covers 24h-granularity recovery while this is broken.

        - alert: FountainPitrBaseBackupNeverSucceeded
          # Before the first successful base backup the timestamp is 0, so
          # the staleness alert above deliberately ignores it. Mirrors
          # FountainBackupNeverSucceeded: either the ScheduledBackup was
          # just created, or every backup so far has failed — both mean
          # there is no base to replay WAL against, i.e. no PITR at all.
          expr: |
            cnpg_collector_last_available_backup_timestamp{namespace="fountain"} == 0
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "CNPG has never completed a base backup for fountain-pg"
            description: |
              WAL may be archiving, but without a base backup to replay it
              against there is no point-in-time recovery. Check that the
              ScheduledBackup exists and its Backups are completing:
              kubectl get scheduledbackup,backups -n fountain

        - alert: FountainPitrBackupFailed
          # A failure timestamp newer than the newest good backup means the
          # most recent attempt failed. Clears on its own once a later
          # backup succeeds.
          expr: |
            cnpg_collector_last_failed_backup_timestamp{namespace="fountain"}
              >
            cnpg_collector_last_available_backup_timestamp{namespace="fountain"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The most recent CNPG base backup for fountain-pg failed"
            description: |
              The last base backup attempt failed; the newest restorable base
              is one night older than it should be. One failure is not yet
              data loss — FountainPitrBaseBackupStale escalates if it keeps
              happening.
              Check: kubectl get backups -n fountain --sort-by=.metadata.creationTimestamp | tail
              Logs:  kubectl logs -n fountain fountain-pg-1 -c plugin-barman-cloud

        - alert: FountainPitrWalArchivingFailing
          # cnpg_collector_pg_wal_archive_status counts WAL segments in
          # pg_wal/archive_status: value="ready" is waiting to be archived,
          # value="done" is archived. Postgres archives serially and retries
          # a failing segment forever, so a ready count that stays elevated
          # means the archiver is failing and the PITR window has stopped
          # advancing. Left failing long enough, unarchivable WAL also
          # cannot be recycled and eventually fills the 10Gi volume.
          expr: |
            cnpg_collector_pg_wal_archive_status{namespace="fountain", value="ready"} > 2
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving for fountain-pg is falling behind"
            description: |
              {{ $value }} WAL segments are stuck waiting to be archived to
              s3://fountain-backups/barman/. PITR only reaches the last
              archived segment, so the recoverable window is no longer
              advancing. Likely causes: Garage unreachable, rotated
              credentials, or the bucket at its 5GiB quota.

              Check: kubectl exec -n fountain fountain-pg-1 -c postgres -- \
                       psql -c 'select * from pg_stat_archiver'
              Logs:  kubectl logs -n fountain fountain-pg-1 -c plugin-barman-cloud

        - alert: FountainPitrMetricsAbsent
          # None of the alerts above can fire on a metric that is not being
          # scraped at all — this is the watcher's watcher. It fires if the
          # cnpg_* series vanish: PodMonitor deleted, selector drift in
          # kube-prometheus-stack, or the instance exporter broken. Scoped
          # to one representative series; they come from the same exporter.
          expr: |
            absent(cnpg_collector_last_available_backup_timestamp{namespace="fountain"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CNPG backup metrics for fountain-pg are not being scraped"
            description: |
              cnpg_collector_last_available_backup_timestamp has been absent
              for an hour, so every PITR alert is blind. Check that the
              PodMonitor exists and Prometheus has the target:
              kubectl get podmonitor -n fountain
              then look for fountain-pg under Status > Targets in Prometheus.

    # ── Application health ────────────────────────────────────────────────
    - name: fountain-app
      interval: 30s
      rules:
        - alert: FountainMetricsTargetDown
          # Also the canary for "the app is up but wedged": Prometheus scrapes
          # a separate Bandit listener inside the same BEAM, so a scrape failure
          # while pods look Ready means the VM itself is in trouble.
          expr: up{namespace="fountain", service="fountain"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Fountain metrics endpoint is not scrapeable"
            description: |
              Prometheus cannot scrape {{ $labels.pod }} on the metrics port.
              The pod may be Ready from the readiness probe's point of view while
              the BEAM is unable to serve.

        - alert: FountainHighServerErrorRate
          # 5xx as a share of all responses. Rate over 5m so a single blip does
          # not page; 5% sustained for 10m is a real regression.
          expr: |
            sum(rate(phoenix_router_dispatch_stop_count{namespace="fountain", status=~"5.."}[5m]))
              /
            sum(rate(phoenix_router_dispatch_stop_count{namespace="fountain"}[5m]))
              > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Over 5% of Fountain responses are 5xx"
            description: |
              {{ $value | humanizePercentage }} of responses over the last 5
              minutes were server errors. Detail is in Sentry; the raw request
              logs are in Loki ({namespace="fountain"}).

        - alert: FountainUnhandledExceptions
          expr: |
            sum(rate(phoenix_router_dispatch_exception_count{namespace="fountain"}[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Fountain is raising unhandled exceptions"
            description: |
              Exceptions escaping the router on {{ $labels.route }}. Stack
              traces are in Sentry; the logs have the raw output.

        - alert: FountainDatabasePoolSaturated
          # queue_time is time spent waiting for a connection. It climbs when the
          # pool is exhausted, which presents as "everything got slow" rather
          # than "one query got slow" — a genuinely hard thing to diagnose
          # without this signal.
          expr: |
            histogram_quantile(0.95,
              sum(rate(fountain_repo_query_queue_time_bucket{namespace="fountain"}[5m])) by (le)
            ) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Fountain is waiting on the database connection pool"
            description: |
              p95 wait for a connection is {{ $value | humanize }}ms. Pool size is
              10 per replica. Sustained waits mean either slow queries holding
              connections or genuine saturation.

    # ── Sandboxes ─────────────────────────────────────────────────────────
    - name: fountain-sandboxes
      interval: 60s
      rules:
        - alert: FountainProvisionFailures
          # Counts the "failed" stage events ConversationServer publishes —
          # every failure path funnels through them, including ones rescued
          # inside the GenServer that no exception metric ever sees (#310).
          # Absolute count, not a rate: at current traffic a per-second rate
          # threshold would need ~45 failures per window to fire, which is
          # "hear it from users first" territory. Three failures in 30m is
          # already a broken Sprites token or outage.
          expr: |
            sum(increase(fountain_stage_count{namespace="fountain", stage="provision", status="failed"}[30m])) > 2
          labels:
            severity: warning
          annotations:
            summary: "Fountain sandbox provisioning is failing"
            description: |
              Provisions are failing after retries. Users see conversations
              that fail to start. Most likely causes: the platform
              SPRITES_TOKEN is invalid or rate-limited, the Sprites API is
              unhealthy, or tenants are hitting the concurrency cap.

        - alert: FountainProvisionDeadlineExceeded
          # The provision watchdog (#329) declared a provision wedged and
          # force-failed it. Per #394 the accompanying destroy is best-effort,
          # so each firing may also leak a sprite that keeps billing — this is
          # a cost signal as much as a UX one. Absolute count, not a rate:
          # the event is rare by design and any occurrence is worth a look.
          expr: |
            sum(increase(fountain_provision_deadline_exceeded_count{namespace="fountain"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "A Fountain provision hit the watchdog deadline"
            description: |
              {{ $value }} provision(s) in the last hour ran past the watchdog
              deadline and were force-failed. Each one may have leaked a
              sprite (#394) — check whether the reaper's untracked count rose
              on its next run, and why the provision wedged:
              kubectl logs -n fountain deploy/fountain | grep "provisioning exceeded"

        - alert: FountainSandboxBudgetExceeded
          # Platform-wide concurrency ceiling (#405). Every tenant's sprites
          # bill to the single platform SPRITES_TOKEN and the only enforced
          # cap is per-tenant (default 5), so total concurrent spend is
          # otherwise `users x 5` with no ceiling. The 50 here is the initial
          # platform budget — an operator knob, not a law: raise it
          # deliberately when paying for more concurrency is intended. The
          # durable fix is a global reservation check in
          # Quotas.with_sandbox_reservation/3; until that exists this alert
          # is the only platform-level ceiling.
          expr: |
            sum(fountain_sandboxes_count{namespace="fountain", status=~"pending|starting|ready"}) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Fountain sandbox concurrency is above the platform budget"
            description: |
              {{ $value }} sandboxes are pending/starting/ready against a
              budget of 50, all billing to the one platform SPRITES_TOKEN.
              Find who is driving it:
              kubectl exec -n fountain fountain-pg-1 -c postgres -- \
                psql -U postgres fountain -c "select user_id, count(*) from sandboxes where status in ('pending','starting','ready') group by 1 order by 2 desc limit 10"

        - alert: FountainConversationsAboveBudget
          # Companion to the sandbox budget above, on the conversation gauge
          # (#321): a pending/running conversation implies a live sprite, so
          # in steady state the two track each other. This one still fires
          # when sandbox rows are wrong — the exact drift SandboxReaper
          # measures — and shares the same 50 operator knob.
          expr: |
            sum(fountain_conversations_count{namespace="fountain", status=~"pending|running"}) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Fountain has more live conversations than the platform budget"
            description: |
              {{ $value }} conversations are pending/running against a budget
              of 50. If FountainSandboxBudgetExceeded is not also firing, the
              sandbox rows and reality have diverged — check the reaper log
              line for released/expired/untracked counts.

    # ── Sprite reaper (#405) ──────────────────────────────────────────────
    #
    # SandboxReaper reconciles the sandboxes table against sprites.dev
    # hourly (crontab :07). Its third pass counts sprites running with no
    # sandbox row and deliberately never destroys them — so its entire
    # output is a gauge someone must be looking at, plus these alerts.
    - name: fountain-reaper
      interval: 60s
      rules:
        - alert: FountainUntrackedSprites
          # fountain_reaper_untracked_count is the LEVEL of sprites alive at
          # sprites.dev with no live sandbox row, re-measured every run.
          # Sustained non-zero is leaked money, not an outage — hence
          # warning, not critical. 2h means at least two consecutive hourly
          # runs both saw leaks, which filters the legitimate transients the
          # reaper moduledoc describes (a sprite created seconds before the
          # sweep, a developer using the shared token).
          expr: fountain_reaper_untracked_count{namespace="fountain"} > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Sprites are running with no sandbox row (leaked spend)"
            description: |
              {{ $value }} sprite(s) have been running at sprites.dev with no
              live sandbox row for over 2h, billing the platform
              SPRITES_TOKEN. The reaper deliberately never destroys these —
              absence of a row is not proof of a leak — so a human has to
              look at the list and clean up. The run log includes a sample of
              the sprite names:
              kubectl logs -n fountain deploy/fountain | grep "no sandbox row"

        - alert: FountainReaperSilent
          # The wedged-reaper canary. fountain_reaper_run_released is emitted
          # at the end of every hourly run, so the series (re)appears within
          # about an hour of pod start; absent() for 3h means no run has
          # completed since boot — crontab dropped, maintenance queue
          # misconfigured, or every run crashing before the emit. A reaper
          # that runs and raises is caught by FountainObanJobsRaising /
          # FountainObanJobsDiscarded instead. An increase()-based staleness
          # check cannot work here: released/expired are legitimately zero
          # for weeks at a time, so the counter is flat when healthy.
          expr: absent(fountain_reaper_run_released{namespace="fountain"})
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "SandboxReaper has not completed a run since boot"
            description: |
              No fountain_reaper_run_released series exists, meaning no
              SandboxReaper run has finished on this pod (it runs hourly at
              :07). Stuck rows are holding tenant quota and dead sprites are
              not being destroyed. Check the maintenance queue:
              kubectl exec -n fountain fountain-pg-1 -c postgres -- \
                psql -U postgres fountain -c "select id, state, attempt, errors[array_upper(errors,1)] from oban_jobs where worker like '%SandboxReaper%' order by id desc limit 5"

    # ── Oban background jobs (#321) ───────────────────────────────────────
    #
    # Oban catches job exceptions internally and reports them only via
    # telemetry — no process crashes, so neither Sentry's LoggerHandler nor
    # any crash report sees a failing nightly RetentionPruner or hourly
    # SandboxReaper. These watch the metrics the app exports from Oban's
    # own events (fountain_oban_job_*) and the polled queue-depth gauge.
    - name: fountain-oban
      interval: 60s
      rules:
        - alert: FountainObanJobsRaising
          # Every raising execution counts, including retries — the early
          # signal, while Oban is still retrying and the job might yet
          # succeed. Worker is in the labels so the page says which job.
          expr: |
            sum by (queue, worker) (increase(fountain_oban_job_exception_count{namespace="fountain"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Oban jobs are raising in {{ $labels.queue }} ({{ $labels.worker }})"
            description: |
              {{ $value }} raising execution(s) in the last hour. Oban retries
              with backoff, so this may self-heal — but a persistently raising
              maintenance job means reaping/pruning/metering is not happening.
              Detail is in Sentry only if the worker reports it explicitly;
              check the job row's errors array:
              kubectl exec -n fountain fountain-pg-1 -c postgres -- \
                psql -U postgres fountain -c "select id, worker, state, attempt, errors[array_upper(errors,1)] from oban_jobs where queue='{{ $labels.queue }}' order by id desc limit 5"
        - alert: FountainObanJobsDiscarded
          # A discarded job exhausted every retry and failed permanently.
          # delta on the gauge rather than a static > 0: discarded rows sit
          # for 7 days until Oban's Pruner removes them, and an alert that
          # stays red for a week after one bad job trains people to ignore it.
          expr: |
            delta(fountain_oban_queue_depth{namespace="fountain", state="discarded"}[2h]) > 0
          labels:
            severity: critical
          annotations:
            summary: "An Oban job in {{ $labels.queue }} was discarded (all retries exhausted)"
            description: |
              The scheduled work this job represents did not happen — for the
              maintenance queue that means reaping, retention or metering
              silently stopped. Inspect and re-run:
              kubectl exec -n fountain fountain-pg-1 -c postgres -- \
                psql -U postgres fountain -c "select id, worker, errors[array_upper(errors,1)] from oban_jobs where state='discarded' order by id desc limit 5"
        - alert: FountainObanQueueBacklog
          # available = runnable now but not picked up. A sustained backlog
          # means concurrency is saturated or a worker is wedged.
          expr: |
            fountain_oban_queue_depth{namespace="fountain", state="available"} > 25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Oban queue {{ $labels.queue }} has a sustained backlog"
            description: |
              {{ $value }} jobs runnable-but-waiting for 30m. Check whether
              the queue's workers are wedged (executing depth pinned at its
              concurrency limit) or something is enqueueing faster than the
              queue drains.
