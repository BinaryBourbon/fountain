# The pin. A strategic-merge patch over the baseline Deployment carrying the
# two values that name what runs: the image tag and the commit it was built
# from. Both literals below are inert in git — publish-manifests.yml rewrites
# them in the artifact, on the tree that was actually built, and refuses to
# publish if either substitution fails to land. See kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain
  namespace: fountain
spec:
  template:
    spec:
      containers:
        - name: fountain
          image: ghcr.io/binarybourbon/fountain:sha-0000000000000000000000000000000000000000
          env:
            # Which commit this pod is running. Not baked into the image:
            # build.yml stopped passing BUILD_SHA so that an image built from
            # a tree is reusable for any commit with that tree, and this env
            # (which wins over the image's ENV) names the commit actually
            # deployed. It reaches the console footer (FountainWeb.Layouts)
            # and the Sentry release (config/runtime.exs), so a wrong value
            # misattributes every error to the wrong commit.
            - name: FOUNTAIN_BUILD_SHA
              value: "0000000000000000000000000000000000000000"
