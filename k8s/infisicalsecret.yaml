apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fountain-secrets
  namespace: fountain
  labels:
    app: fountain
spec:
  # Internal Service DNS — no Traefik/Cloudflare round-trip for in-cluster
  # reconciles. Matches the operator's default but explicit so this CR is
  # self-documenting.
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        # Auto-generated slug from magpie when the `fountain` project
        # was created (see seed script run on 2026-05-21).
        projectSlug: fountain-q-cwt
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: fountain-infisical-auth
        secretNamespace: fountain
  managedSecretReference:
    secretName: fountain-secrets  # consumed by Deployment via envFrom
    secretNamespace: fountain
    # Orphan instead of Owner so the operator overwrites in place if a
    # pre-existing fountain-secrets Secret is present at first reconcile
    # (manual seed during cutover). Deleting the CR leaves the Secret
    # behind — acceptable, CR deletion is rare and intentional.
    creationPolicy: Orphan
